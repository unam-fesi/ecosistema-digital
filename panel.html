<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel interno — Aval de Diplomados · DEU FES Iztacala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#062B5C;--deep:#031A38;--navy2:#0A4A87;--gold:#D5A021;--gold-l:#F0C75E;
  --cream:#FAF8F4;--ink:#0A1A30;--emerald:#34D399;--amber:#F5B841;--red:#EF6461;--cyan:#38BDF8;--violet:#7C5CFF;
  --line:rgba(12,35,64,.10);--shadow-1:0 10px 30px rgba(3,20,40,.18);--shadow-2:0 24px 80px rgba(3,20,40,.30);--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#eef3f9;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.serif{font-family:'Playfair Display',serif}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{line-height:1.2}.hidden{display:none!important}.muted{color:#6b7686}
#deu-bg{position:fixed;inset:0;z-index:0}
.shell{position:relative;z-index:1}

.appbar{position:sticky;top:0;z-index:60;background:rgba(6,43,92,.82);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:62px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-chip{background:#fff;border-radius:10px;padding:5px 10px;display:flex;align-items:center}
.logo-chip img{height:34px;display:block}
.appbar .title{font-weight:600;font-size:.95rem}.appbar .title small{display:block;color:#9db2ce;font-weight:400;font-size:.68rem}
.appbar-spacer{flex:1}
.btn-home{color:#c3d2e6;font-size:.84rem;padding:8px 12px;border-radius:8px}.btn-home:hover{background:rgba(255,255,255,.08);color:#fff}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem}
.user-chip small{color:#c3d2e6;line-height:1.1}

.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
.page-head{margin-bottom:18px;color:var(--ink)}
.page-head .kick{color:#a9781a;font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase}
.page-head h1{font-size:1.7rem;margin:4px 0 6px;color:var(--navy)}
.page-head p{color:#54606f;max-width:70ch;font-size:.94rem}

.card{background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(6,43,92,.10);border-radius:18px;padding:20px;box-shadow:0 18px 50px rgba(6,43,92,.14),inset 0 1px 0 rgba(255,255,255,.7)}
.card+.card{margin-top:16px}
.card h2{font-size:1.1rem;margin-bottom:4px}.card h3{font-size:.96rem}
.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:860px){.grid-2,.grid-4{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:10px 17px;border-radius:10px;font-weight:600;font-size:.86rem;transition:.2s var(--ease)}
.btn:hover{background:#083a72;transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.gold:hover{background:var(--gold-l)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy)}.btn.ghost:hover{border-color:var(--gold);background:#fbf6ea}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:8px}

.stat{background:rgba(255,255,255,.82);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid rgba(6,43,92,.10);border-radius:18px;padding:16px 18px;box-shadow:0 14px 40px rgba(6,43,92,.13),inset 0 1px 0 rgba(255,255,255,.7)}
.stat .lbl{font-size:.74rem;color:#8a97a8;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat .val{font-size:1.9rem;font-weight:700;color:var(--navy);margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:.76rem;margin-top:2px;color:#8a97a8}
.barrow{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;margin:8px 0;font-size:.83rem}
.bartrack{background:#f0ece3;border-radius:6px;height:15px;overflow:hidden}
.barfill{height:100%;background:linear-gradient(90deg,var(--gold-l),var(--gold));border-radius:6px}
.barrow .n{text-align:right;font-weight:600;color:var(--navy)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:.73rem;font-weight:600}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.borrador{background:#eef1f5;color:#5a6675}.pill.borrador .dot{background:#8a97a8}
.pill.en_revision_carrera{background:#efe8fb;color:#5b3fc4}.pill.en_revision_carrera .dot{background:var(--violet)}
.pill.en_revision_deu{background:#e3f4fd;color:#0b6fa4}.pill.en_revision_deu .dot{background:var(--cyan)}
.pill.avalado{background:#e2f7ee;color:#0d8b5c}.pill.avalado .dot{background:var(--emerald)}
.pill.condicionado{background:#fdf3dd;color:#a67c14}.pill.condicionado .dot{background:var(--amber)}
.pill.rechazado{background:#fdeaea;color:#c0392b}.pill.rechazado .dot{background:var(--red)}
.pill.pendiente{background:#fdf3dd;color:#a67c14}.pill.pendiente .dot{background:var(--amber)}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;color:#8a97a8;font-weight:600;font-size:.71rem;text-transform:uppercase;letter-spacing:.06em;padding:9px 11px;border-bottom:1px solid var(--line)}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#faf8f4}
.t-folio{font-family:ui-monospace,monospace;font-size:.79rem;color:var(--navy);font-weight:600}

.field{margin-bottom:13px}
.field label{display:block;font-size:.8rem;font-weight:600;color:#3a4557;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:.88rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(213,160,33,.16)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 14px;font-size:.87rem}
.kv .k{color:#8a97a8;font-weight:500}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv .k{margin-top:6px}}
.divider{height:1px;background:var(--line);margin:16px 0}
.tag{display:inline-block;background:#f3f0ea;border:1px solid var(--line);color:#5a6675;border-radius:6px;padding:1px 8px;font-size:.72rem;margin:2px 3px 0 0}
.empty{padding:24px;text-align:center;color:#8a97a8;font-size:.88rem}

.check{display:flex;align-items:flex-start;gap:11px;padding:11px 3px;border-bottom:1px solid var(--line)}
.check:last-child{border:none}
.check .ci{width:25px;height:25px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700}
.ci.ok{background:#e2f7ee;color:#0d8b5c}.ci.warn{background:#fdf3dd;color:#a67c14}.ci.err{background:#fdeaea;color:#c0392b}.ci.info{background:#e3f4fd;color:#0b6fa4}
.check .ct{font-weight:600;font-size:.86rem}.check .cd{font-size:.79rem;color:#6b7686;margin-top:2px}
.notice{display:flex;gap:11px;padding:12px 14px;border-radius:11px;font-size:.82rem;line-height:1.5}
.notice.legal{background:#f4f0fb;border:1px solid #e0d3f5;color:#4a3a6b}
.notice.info{background:#eef6fd;border:1px solid #cfe6f7;color:#0b5680}
.vote-member{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.vote-member:last-child{border:none}
.vote-member .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;flex-shrink:0}
.vote-member .vn{font-weight:600;font-size:.84rem}.vote-member .vr{font-size:.73rem;color:#8a97a8}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px;flex-wrap:wrap}
.tabbar button{padding:8px 13px;font-size:.83rem;font-weight:600;color:#6b7686;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button.active{color:var(--navy);border-bottom-color:var(--gold)}

.modal{position:fixed;inset:0;background:rgba(3,16,36,.5);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-card{backdrop-filter:blur(20px)}
.modal.active{display:flex}
.modal-card{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:410px;box-shadow:var(--shadow-2)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:30px;font-size:.85rem;font-weight:500;box-shadow:var(--shadow-2);z-index:120;transition:.35s var(--ease);opacity:0}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.val-msg.err{color:#c0392b;font-size:.8rem}
.tl{position:relative;padding-left:24px;margin-top:6px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-21px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--line)}
.tl-item.done::before{background:var(--emerald);border-color:var(--emerald)}
.tl-item.active::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(213,160,33,.2)}
.tl-item .tt{font-weight:600;font-size:.86rem}.tl-item .td{font-size:.76rem;color:#8a97a8}
/* ── Centro de Inteligencia ── */
.anav{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 18px;background:rgba(255,255,255,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(6,43,92,.1);border-radius:14px;padding:6px;box-shadow:0 8px 26px rgba(6,43,92,.1)}
.anav button{padding:9px 14px;border-radius:10px;font-size:.85rem;font-weight:600;color:#54606f;white-space:nowrap;transition:.15s}
.anav button.active{background:var(--navy);color:#fff}
.anav button:hover:not(.active){background:#eef1f5}
.funnel{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fbar{position:relative;color:#fff;border-radius:9px;padding:10px 13px;font-size:.85rem;font-weight:600;display:flex;justify-content:space-between;min-width:130px;transition:width .5s var(--ease)}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.heatgrid{display:grid;gap:3px;font-size:.7rem;margin-top:8px}
.heatcell{padding:9px 3px;border-radius:6px;text-align:center;font-weight:700}
.slider-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:.84rem}
.slider-row label{width:130px;color:#3a4557;font-weight:600}
.slider-row input[type=range]{flex:1;accent-color:var(--gold)}
.slider-row .v{width:54px;text-align:right;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.nodeinfo{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px;margin:1px 2px 1px 0}
.flag.red{background:#fdeaea;color:#c0392b}.flag.amber{background:#fdf3dd;color:#a67c14}.flag.ok{background:#e2f7ee;color:#0d8b5c}.flag.info{background:#e3f4fd;color:#0b6fa4}
.mini{padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:.84rem;font-family:inherit;background:#fff}
.dlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;margin-top:8px}
.dlegend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.insight{display:flex;gap:10px;padding:11px 13px;border-left:3px solid var(--gold);background:rgba(213,160,33,.07);border-radius:0 10px 10px 0;margin:8px 0;font-size:.86rem}
.g3d-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(6,43,92,.14);background:radial-gradient(circle at 50% 30%,#0d2444,#071022)}
.g3d-hint{position:absolute;top:10px;left:12px;background:rgba(7,16,34,.72);border-radius:8px;padding:5px 10px;font-size:11px;color:#cdd8e8}
.pumai-analyst{display:flex;flex-direction:column;gap:8px}
.pa-msg{max-width:88%;padding:10px 13px;border-radius:13px;font-size:.86rem;line-height:1.5}
.pa-msg.bot{background:#f2f5f9;align-self:flex-start;border-bottom-left-radius:4px}
.pa-msg.user{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
</style>
</head>
<body>
<div id="deu-bg"></div>
<div class="shell">
  <div class="appbar">
    <div class="logo-chip"><img src="public/assets/Gestion-diplomados-logo.png" alt="Gestión de Diplomados"></div>
    <div class="title">Panel interno<small>Comités y Administración · DEU FES Iztacala</small></div>
    <div class="appbar-spacer"></div>
    <a href="diplomados.html" class="btn-home">Registro público</a>
    <div id="userChip" class="user-chip hidden"><div class="av" id="avInit">U</div><div><small id="uName" style="color:#fff;font-weight:600;display:block">Usuario</small><small id="uRole">—</small></div></div>
    <button id="perfilBtn" class="btn-home hidden">Mi perfil</button>
    <button id="logoutBtn" class="btn-home hidden">Salir</button>
  </div>

  <div class="wrap" id="wrap">
    <div id="mainViews"></div>
  </div>
</div>

<!-- AUTH -->
<div class="modal" id="authModal">
  <div class="modal-card">
    <h2 class="serif">Acceso al panel interno</h2>
    <p class="muted" style="font-size:.85rem;margin-top:2px">Para miembros de comité y administración. Las cuentas las provisiona la DEU.</p>
    <div class="field" style="margin-top:14px"><label>Correo</label><input id="a_email" type="email"></div>
    <div class="field"><label>Contraseña</label><input id="a_pass" type="password"></div>
    <div id="authErr" class="val-msg err" style="min-height:16px"></div>
    <button class="btn gold" id="authSubmit" style="width:100%;justify-content:center">Entrar</button>
  </div>
</div>

<div class="modal" id="perfilModal">
  <div class="modal-card">
    <h2 class="serif">Mi perfil</h2>
    <p class="muted" style="font-size:.84rem;margin-top:2px">Sesión: <span id="perfilCorreo"></span></p>
    <div class="field" style="margin-top:14px"><label>Nueva contraseña</label><input id="p_pass1" type="password" placeholder="Mínimo 6 caracteres"></div>
    <div class="field"><label>Confirmar contraseña</label><input id="p_pass2" type="password"></div>
    <div id="perfilMsg" style="min-height:16px;font-size:.8rem"></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost" id="perfilCancel">Cerrar</button><button class="btn gold" id="perfilSave">Guardar contraseña</button></div>
  </div>
</div>

<div id="toast"></div>

<script src="src/js/deu-background.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const SUPABASE_URL='https://risatbuqolklefvjgngb.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpc2F0YnVxb2xrbGVmdmpnbmdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNjc0MzUsImV4cCI6MjA4OTc0MzQzNX0.PTDGmpihCPd5iz8ZhbcUOMbGNuS4mi1sCD5linrVGvY';
const SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const DEU=()=>SB.schema('deu');
let USER=null, PERFIL=null;
const $=s=>document.querySelector(s), M=()=>document.getElementById('mainViews');
function esc(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);}
const CARRERA_LBL={medicina:'Medicina',cirujano_dentista:'Cirujano Dentista',enfermeria:'Enfermería',optometria:'Optometría',psicologia:'Psicología',biologia:'Biología',interdisciplinaria:'Interdisciplinaria'};
const TIPO_LBL={diplomado:'Diplomado',curso:'Curso',taller:'Taller',diplomado_titulacion:'Diplomado (titulación)'};
const ESTADO_LBL={borrador:'Borrador',en_revision_carrera:'En comité de carrera',en_revision_deu:'En comité DEU',avalado:'Avalado',condicionado:'Condicionado',rechazado:'No avalado'};
const ROL_LBL={registrante:'Responsable académico',comite_carrera:'Comité de carrera',comite_deu:'Comité DEU',admin:'Administrador'};
const SENTIDO_LBL={a_favor:'A favor',a_favor_condiciones:'A favor con condiciones',en_contra:'En contra',abstencion:'Abstención'};

/* ── Auth ── */
$('#authSubmit').onclick=async()=>{
  const email=$('#a_email').value.trim(), pass=$('#a_pass').value; $('#authErr').textContent='';
  if(!email||!pass){$('#authErr').textContent='Completa correo y contraseña.';return;}
  try{const {error}=await SB.auth.signInWithPassword({email,password:pass});if(error)throw error;
    $('#authModal').classList.remove('active'); await boot();
  }catch(e){$('#authErr').textContent=e.message||'No se pudo entrar.';}
};
$('#logoutBtn').onclick=async()=>{await SB.auth.signOut();location.reload();};
$('#perfilBtn').onclick=()=>{$('#perfilCorreo').textContent=USER?USER.email:'';$('#p_pass1').value='';$('#p_pass2').value='';$('#perfilMsg').textContent='';$('#perfilModal').classList.add('active');};
$('#perfilCancel').onclick=()=>$('#perfilModal').classList.remove('active');
$('#perfilSave').onclick=async()=>{
  const a=$('#p_pass1').value, b=$('#p_pass2').value; const msg=$('#perfilMsg');
  if(a.length<6){msg.style.color='#c0392b';msg.textContent='La contraseña debe tener al menos 6 caracteres.';return;}
  if(a!==b){msg.style.color='#c0392b';msg.textContent='Las contraseñas no coinciden.';return;}
  try{const {error}=await SB.auth.updateUser({password:a});if(error)throw error;
    $('#perfilModal').classList.remove('active');toast('Contraseña actualizada ✓');
  }catch(e){msg.style.color='#c0392b';msg.textContent=e.message||'No se pudo actualizar.';}
};

async function boot(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){$('#authModal').classList.add('active');return;}
  USER=session.user;
  const {data:perfil}=await DEU().from('perfiles').select('*').eq('user_id',USER.id).maybeSingle();
  PERFIL=perfil;
  if(!perfil||perfil.rol==='registrante'){
    M().innerHTML='<div class="card"><div class="empty">Tu cuenta no tiene un rol interno asignado. Solicita a la administración de la DEU que te dé de alta como miembro de comité o administrador.</div></div>';
    $('#uName').textContent=USER.email;$('#uRole').textContent='Sin rol interno';$('#avInit').textContent=(USER.email[0]||'U').toUpperCase();
    $('#userChip').classList.remove('hidden');$('#logoutBtn').classList.remove('hidden');$('#perfilBtn').classList.remove('hidden');return;
  }
  $('#uName').textContent=perfil.nombre;$('#uRole').textContent=ROL_LBL[perfil.rol]+(perfil.carrera?(' · '+CARRERA_LBL[perfil.carrera]):'');
  $('#avInit').textContent=(perfil.nombre[0]||'U').toUpperCase();
  $('#userChip').classList.remove('hidden');$('#logoutBtn').classList.remove('hidden');$('#perfilBtn').classList.remove('hidden');
  if(perfil.rol==='admin')adminDashboard(); else bandeja();
}

/* ═══════════ COMITÉS: bandeja ═══════════ */
async function bandeja(){
  const etapa = PERFIL.rol==='comite_deu'?'deu':'carrera';
  const estado = etapa==='deu'?'en_revision_deu':'en_revision_carrera';
  const {data,error}=await DEU().from('actividades').select('id,folio,titulo,tipo,carrera,estado,duracion_horas,creditos').eq('estado',estado).order('created_at',{ascending:true});
  const kick = etapa==='deu'?'Comité DEU · Validación institucional':('Comité de Carrera · '+CARRERA_LBL[PERFIL.carrera]);
  let rows='';
  if(error) rows='<div class="empty">Error: '+esc(error.message)+'</div>';
  else if(!data.length) rows='<div class="empty">No hay solicitudes pendientes en tu bandeja.</div>';
  else rows='<table><thead><tr><th>Folio</th><th>Actividad</th><th>Tipo</th><th>Carrera</th><th></th></tr></thead><tbody>'+
    data.map(a=>`<tr><td class="t-folio">${esc(a.folio)}</td><td>${esc(a.titulo)}</td><td>${TIPO_LBL[a.tipo]}</td><td>${CARRERA_LBL[a.carrera]}</td>
    <td><button class="btn sm gold" data-open="${a.id}">Dictaminar</button></td></tr>`).join('')+'</tbody></table>';
  M().innerHTML=`<div class="page-head"><div class="kick">${esc(kick)}</div><h1 class="serif">Bandeja de dictaminación</h1><p>Evalúa de forma colegiada la pertinencia de las actividades asignadas. Requiere quórum y mayoría.</p></div>
    <div class="card">${rows}</div>`;
  M().querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detalle(b.dataset.open, etapa));
}

async function detalle(id, etapa){
  M().innerHTML='<div class="card"><div class="empty">Cargando expediente…</div></div>';
  const {data:a}=await DEU().from('actividades').select('*').eq('id',id).single();
  const {data:resp}=await DEU().from('responsables').select('*').eq('actividad_id',id).maybeSingle();
  let verif=null;
  if(resp){const {data:vs}=await DEU().from('verificaciones_raa').select('*').eq('responsable_id',resp.id).order('created_at',{ascending:false}).limit(1);verif=(vs||[])[0];}
  const {data:docs}=await DEU().from('documentos').select('*').eq('actividad_id',id);
  const {data:votos}=await DEU().from('votos').select('sentido,pertinencia,justificacion,miembro_id').eq('actividad_id',id).eq('etapa',etapa);
  let perfMap={};
  if(votos&&votos.length){const ids=votos.map(v=>v.miembro_id);const {data:ps}=await DEU().from('perfiles').select('id,nombre,rol').in('id',ids);(ps||[]).forEach(p=>perfMap[p.id]=p);}
  const {data:dict}=await DEU().from('dictamenes').select('*').eq('actividad_id',id).eq('etapa',etapa).maybeSingle();

  const pv=(a.pumai_validacion||[]);
  const obs=pv.filter(c=>c.res&&c.res.estado!=='ok').map(c=>`<span class="pill pendiente"><span class="dot"></span>${esc((c.res.msg||'').slice(0,42))}</span>`).join(' ')||'<span class="muted" style="font-size:.83rem">Sin observaciones de PUM-AI.</span>';

  const tem=(a.temario||[]).map(m=>`${esc(m.tema||'')} · ${esc(m.responsable||'')} · ${esc(m.horas||'')} h`).join('<br>')||'—';
  const dossier = verif?dossierHTML(verif):'<div class="notice info"><span>ℹ</span><div>Aún no se ejecuta la verificación del responsable académico.</div></div>';

  M().innerHTML=`<div class="page-head"><div class="kick">${etapa==='deu'?'Comité DEU':('Comité de Carrera · '+CARRERA_LBL[a.carrera])} · ${esc(a.folio)}</div>
    <h1 class="serif">${esc(a.titulo)}</h1></div>
  <div class="row" style="margin-bottom:12px"><button class="btn ghost sm" id="volver">← Bandeja</button><span class="pill ${a.estado}"><span class="dot"></span>${ESTADO_LBL[a.estado]}</span></div>
  <div class="grid grid-2">
    <div>
      <div class="card"><h2>Ficha de la actividad</h2>
        <div class="kv" style="margin-top:10px">
          <div class="k">Tipo · duración</div><div>${TIPO_LBL[a.tipo]} · ${a.duracion_horas} h · ${a.creditos} créditos</div>
          <div class="k">Modalidad</div><div>${esc(a.modalidad)}</div>
          <div class="k">Responsable</div><div>${esc(resp?resp.nombre:'—')}${resp&&resp.cedula_profesional?(' · céd. '+esc(resp.cedula_profesional)):''}</div>
          <div class="k">Objetivo general</div><div>${esc(a.objetivo_general||'—')}</div>
          <div class="k">Módulos</div><div>${tem}</div>
          <div class="k">Evaluación</div><div>${esc(a.evaluacion||'—')}</div>
          <div class="k">Documentos</div><div>${(docs||[]).map(d=>esc(d.nombre)).join(', ')||'—'}</div>
        </div>
        <div class="divider"></div><h3>Observaciones de PUM-AI</h3><div style="margin-top:8px">${obs}</div>
      </div>
      <div class="card"><h2>Verificación del responsable académico</h2><div style="margin-top:8px">${dossier}</div></div>
    </div>
    <div>
      <div class="card"><h2>Votación colegiada</h2>
        <div id="votosBox" style="margin-top:6px">${votosHTML(votos,perfMap)}</div>

      </div>

    $('#btnVoto').onclick=async()=>{

  ADMIN_DATA=a.data||[]; DICT=d.data||[]; VERIF=v.data||[]; RESP=r.data||[]; DOCS=doc.data||[];
  CFG=(cfg&&cfg.data)||{nivel_analisis:'basico',fuentes:[],umbral_confianza:60,retencion_dias:365};

function computeMeta(){
  const confByResp={}; VERIF.forEach(v=>{ if(!(v.responsable_id in confByResp)) confByResp[v.responsable_id]=v.indice_confianza; });
  const respByAct={}; RESP.forEach(r=>{ (respByAct[r.actividad_id]=respByAct[r.actividad_id]||[]).push(r); });
  const docsByAct={}; DOCS.forEach(x=>{ docsByAct[x.actividad_id]=(docsByAct[x.actividad_id]||0)+1; });
  META={};
  ADMIN_DATA.forEach(act=>{
    const rs=respByAct[act.id]||[]; let conf=null;
    rs.forEach(r=>{ if(r.id in confByResp){ const c=confByResp[r.id]; conf=(conf==null)?c:Math.max(conf,c);} });
    const pv=act.pumai_validacion||[];
    const errs=pv.filter(c=>c&&c.res&&c.res.estado==='err').length;
    const warns=pv.filter(c=>c&&c.res&&c.res.estado==='warn').length;
    const hasDocs=(docsByAct[act.id]||0)>0;
    let score=45; const reasons=[];
    if(act.estado==='avalado'){score+=25;reasons.push('Avalado por los comités');}
    else if(act.estado==='condicionado'){score-=4;reasons.push('Condicionado: requiere correcciones');}
    else if(act.estado==='rechazado'){score-=25;reasons.push('No avalado');}
    if(act.tipo==='diplomado'||act.tipo==='diplomado_titulacion'){ if((act.duracion_horas||0)>=120) score+=8; else {score-=10;reasons.push('Duración < 120 h para diplomado');} }
    if(conf!=null){ score+=Math.round((conf-50)*0.4); reasons.push('Confianza del RAA: '+conf+'/100'); } else reasons.push('RAA sin verificación');
    if(errs){score-=errs*8;reasons.push(errs+' error(es) de cumplimiento');}
    if(warns){score-=warns*3;reasons.push(warns+' observación(es) de PUM-AI');}
    if(!hasDocs){score-=4;reasons.push('Sin documentos cargados');}
    score=Math.max(0,Math.min(100,score));
    META[act.id]={conf,errs,warns,hasDocs,score,reasons,resp:rs[0]};
  });
}

/* ── helpers de gráficas ── */
function barsHTML(obj,lblFn){ const es=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...es.map(e=>e[1]));
  return es.map(([k,n])=>`<div class="barrow"><span>${esc(lblFn?lblFn(k):k)}</span><div class="bartrack"><div class="barfill" style="width:${Math.round(n/mx*100)}%"></div></div><span class="n">${n}</span></div>`).join('')||'<div class="empty">Sin datos.</div>'; }
function donutSVG(data){ const total=data.reduce((s,d)=>s+d.val,0)||1,r=52,C=2*Math.PI*r; let off=0;
  const segs=data.map(d=>{const len=d.val/total*C;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${d.color}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  const leg=data.filter(d=>d.val).map(d=>`<span><i style="background:${d.color}"></i>${esc(d.label)} <b>${d.val}</b></span>`).join('');
  return `<svg viewBox="0 0 140 140" class="chart-svg" style="max-width:170px;margin:0 auto"><circle cx="70" cy="70" r="52" fill="none" stroke="#eef1f5" stroke-width="20"/>${segs}<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="800" fill="#062B5C">${total}</text><text x="70" y="84" text-anchor="middle" font-size="9" fill="#8a97a8">TOTAL</text></svg><div class="dlegend">${leg}</div>`; }
function lineSVG(series){ if(!series.length)return '<div class="empty">Sin datos.</div>'; const W=340,H=130,pad=26,max=Math.max(1,...series.map(s=>s.v));
  const x=i=>pad+(series.length<=1?(W-pad*2)/2:i/(series.length-1)*(W-pad*2)), y=v=>H-pad-(v/max)*(H-pad*1.5);
  const line=series.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(s.v).toFixed(1)}`).join(' ');
  const area=`M${x(0).toFixed(1)} ${H-pad} `+series.map((s,i)=>`L${x(i).toFixed(1)} ${y(s.v).toFixed(1)}`).join(' ')+` L${x(series.length-1).toFixed(1)} ${H-pad} Z`;
  const dots=series.map((s,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(s.v).toFixed(1)}" r="3.2" fill="#D5A021"/><text x="${x(i).toFixed(1)}" y="${(y(s.v)-8).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#062B5C">${s.v}</text>`).join('');
  const labs=series.map((s,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="8" fill="#8a97a8">${esc(s.m)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg"><path d="${area}" fill="rgba(213,160,33,.12)"/><path d="${line}" fill="none" stroke="#D5A021" stroke-width="2.4"/>${dots}${labs}</svg>`; }
function radarSVG(a){ const axes=['Contenido','Duración','Costo/acc.','Alcance','Aval'];
  const unam=[78, Math.min(100,(a.duracion_horas||100)/2), 88, 70, 96];
  const mkt=[72, 62, 45, 80, 40];
  const cx=110,cy=105,R=78,n=axes.length; const pt=(i,val)=>{const ang=-Math.PI/2+i/n*2*Math.PI;return [cx+Math.cos(ang)*R*val/100, cy+Math.sin(ang)*R*val/100];};
  const poly=arr=>arr.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  const grid=[25,50,75,100].map(g=>`<polygon points="${axes.map((_,i)=>pt(i,g).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#e3e8ef"/>`).join('');
  const labs=axes.map((ax,i)=>{const p=pt(i,118);return `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#54606f">${ax}</text>`;}).join('');
  return `<svg viewBox="0 0 220 220" class="chart-svg" style="max-width:280px">${grid}<polygon points="${poly(mkt)}" fill="rgba(124,92,255,.18)" stroke="#7C5CFF" stroke-width="1.5"/><polygon points="${poly(unam)}" fill="rgba(213,160,33,.28)" stroke="#D5A021" stroke-width="2"/>${labs}</svg><div class="dlegend"><span><i style="background:#D5A021"></i>Este diplomado</span><span><i style="background:#7C5CFF"></i>Mercado privado</span></div>`; }
function mdLite(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/\n/g,'<br>'); }

/* ── SECCIÓN: Inteligencia ── */
function secInteligencia(V){
  const byC={},byE={},byT={},byM={}; let confSum=0,confN=0;
  ADMIN_DATA.forEach(a=>{byC[a.carrera]=(byC[a.carrera]||0)+1;byE[a.estado]=(byE[a.estado]||0)+1;byT[a.tipo]=(byT[a.tipo]||0)+1;
    const m=(a.created_at||'').slice(0,7);if(m)byM[m]=(byM[m]||0)+1; const c=META[a.id]&&META[a.id].conf; if(c!=null){confSum+=c;confN++;}});

function grafo3D(canvas,items){
  const w=canvas.clientWidth||700,h=460;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(2,devicePixelRatio||1)); renderer.setSize(w,h,false);
  const scene=new THREE.Scene(); scene.add(new THREE.AmbientLight(0x99a7c0,0.95));
  const key=new THREE.PointLight(0xffffff,0.9);key.position.set(90,130,150);scene.add(key);
  const cam=new THREE.PerspectiveCamera(55,w/h,0.1,3000);cam.position.set(0,0,240);
  const controls=new THREE.OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.08;controls.autoRotate=true;controls.autoRotateSpeed=0.5;
  TS={renderer,raf:null};
  const N=items.length, geo=new THREE.SphereGeometry(1,18,18), meshes=[], pos=[];
  for(let i=0;i<N;i++){ const y=N<=1?0:1-(i/(N-1))*2; const rad=Math.sqrt(Math.max(0,1-y*y)); const th=i*2.399; const R=110; const p=[Math.cos(th)*rad*R,y*R,Math.sin(th)*rad*R]; pos.push(p);
    const hx=semaColor(items[i].estado); const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:hx,emissive:hx,emissiveIntensity:0.55,roughness:0.4,metalness:0.2}));
    const rr=4+(items[i].creditos||4)*0.5; m.scale.set(rr,rr,rr); m.position.set(p[0],p[1],p[2]); m.userData={i}; scene.add(m); meshes.push(m); }
  const byC={}; items.forEach((a,i)=>{(byC[a.carrera]=byC[a.carrera]||[]).push(i);});
  const lp=[]; Object.values(byC).forEach(ix=>{for(let i=0;i<ix.length;i++)for(let j=i+1;j<ix.length;j++){const a=pos[ix[i]],b=pos[ix[j]];lp.push(a[0],a[1],a[2],b[0],b[1],b[2]);}});
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lp),3));
  scene.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x9fb3cc,transparent:true,opacity:0.16})));
  const ray=new THREE.Raycaster(),mo=new THREE.Vector2();
  canvas.addEventListener('click',ev=>{const r=canvas.getBoundingClientRect();mo.x=((ev.clientX-r.left)/r.width)*2-1;mo.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mo,cam);const hh=ray.intersectObjects(meshes);if(hh.length){controls.autoRotate=false;$('#g3dInfo').innerHTML=nodeInfoHTML(items[hh[0].object.userData.i]);}});
  (function loop(){TS.raf=requestAnimationFrame(loop);controls.update();renderer.render(scene,cam);})();
}
function grafo2D(canvas,items){ const host=canvas.parentElement; const W=760,H=460,cols=Math.max(1,Math.ceil(Math.sqrt(items.length)));
  const nodes=items.map((a,i)=>{const cx=60+(i%cols)*((W-120)/Math.max(1,cols-1));const cy=60+Math.floor(i/cols)*72;const rr=9+(a.creditos||4)*0.6;return `<g style="cursor:pointer" data-i="${i}"><circle cx="${cx}" cy="${cy}" r="${rr}" fill="${semaColor(a.estado)}" fill-opacity="0.9" stroke="#fff" stroke-width="1.6"/></g>`;}).join('');

  function stats(){const sc=Math.round(interest());
    document.getElementById('demStats').innerHTML=`<div class="stat" style="box-shadow:none;border:1px solid var(--line)"><div class="lbl">Interés estimado</div><div class="val" style="color:${sc>=65?'#0d8b5c':sc>=45?'#a67c14':'#c0392b'}">${sc}%</div><div class="sub">${Math.round(N*sc/100)} de ${N} potenciales</div></div>
    <div class="insight" style="margin-top:10px">${sc>=65?'Alta probabilidad de demanda; conviene abrir grupo.':sc>=45?'Demanda moderada; refuerza difusión o ajusta precio/modalidad.':'Baja demanda proyectada; revisar pertinencia, precio y difusión.'}</div>`;}
  function draw(){const sc=interest()/100;ctx.clearRect(0,0,cv.width,cv.height);
    for(const a of ag){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>cv.width)a.vx*=-1;if(a.y<0||a.y>cv.height)a.vy*=-1;
      const c=a.seed<sc?'52,211,153':'239,100,97';ctx.beginPath();ctx.arc(a.x,a.y,2.5*dpr,0,6.2832);ctx.fillStyle='rgba('+c+',0.88)';ctx.fill();}
    DEMANDA_RAF=requestAnimationFrame(draw);}
  ['tema','precio','dif','mod'].forEach(k=>document.getElementById('s_'+k).oninput=()=>{document.getElementById('v_'+k).textContent=val('s_'+k);stats();});
  stats(); if(DEMANDA_RAF)cancelAnimationFrame(DEMANDA_RAF); draw();
}

/* ── SECCIÓN: Auditoría / Uso responsable ── */
function secAuditoria(V){
  const analisis=AUDIT.filter(x=>x.accion==='verificar_raa');
  const nombre=e=>(e.detalle&&e.detalle.actor_nombre)||e.actor||'—';
  const persona=e=>(e.detalle&&e.detalle.persona)||'—';
  const byActor={}; analisis.forEach(e=>{(byActor[nombre(e)]=byActor[nombre(e)]||[]).push(e);});
  const rep={}; analisis.forEach(e=>{const k=nombre(e)+'|'+persona(e);rep[k]=(rep[k]||0)+1;});
  const volActores=Object.entries(byActor).filter(([k,a])=>a.length>=6).map(([k])=>k);
  const flagsFor=e=>{const f=[],d=e.detalle||{};
    if(d.consentimiento===false||d.violacion)f.push(['red','Sin consentimiento']);
    if(volActores.includes(nombre(e)))f.push(['amber','Volumen anómalo']);
    if(rep[nombre(e)+'|'+persona(e)]>=3)f.push(['amber','Repetido']);
    if(d.nivel==='profundo')f.push(['info','OSINT profundo']);
    if(new Date(e.created_at).getHours()<6)f.push(['amber','Fuera de horario']);
    return f;};
  const sinConsent=analisis.filter(e=>{const d=e.detalle||{};return d.consentimiento===false||d.violacion;}).length;
  const profundos=analisis.filter(e=>e.detalle&&e.detalle.nivel==='profundo').length;
  const conFlags=analisis.filter(e=>flagsFor(e).length).length;
  const rows=analisis.map(e=>({e,f:flagsFor(e)})).sort((a,b)=>b.f.length-a.f.length);
  window.__AUDIT_ROWS=rows;
  V.innerHTML=`
  <div class="notice legal"><span class="ni">🔒</span><div><b>Uso responsable de datos personales (LFPDPPP).</b> Toda verificación de una persona queda registrada aquí con su evaluador, la persona analizada, el consentimiento, el nivel y la fecha. El sistema marca patrones de posible mal uso para su control; los hallazgos no son veredicto.</div></div>
  <div class="grid grid-4" style="margin:16px 0">
    <div class="stat"><div class="lbl">Análisis de personas</div><div class="val">${analisis.length}</div><div class="sub">verificaciones registradas</div></div>
    <div class="stat"><div class="lbl">Sin consentimiento</div><div class="val" style="color:${sinConsent?'#c0392b':'#0d8b5c'}">${sinConsent}</div><div class="sub">violaciones LFPDPPP</div></div>
    <div class="stat"><div class="lbl">OSINT profundo</div><div class="val">${profundos}</div><div class="sub">mayor sensibilidad</div></div>
    <div class="stat"><div class="lbl">Con señal de alerta</div><div class="val" style="color:${conFlags?'#a67c14':'#0d8b5c'}">${conFlags}</div><div class="sub">a revisar</div></div>
  </div>
  <div class="grid grid-2">
    <div class="card"><h2>Análisis por evaluador</h2><div style="margin-top:8px">${barsHTML(Object.fromEntries(Object.entries(byActor).map(([k,a])=>[k,a.length])))}</div>
      ${volActores.length?`<div class="insight" style="margin-top:10px"><b>${esc(volActores.join(', '))}</b> supera el umbral de volumen (≥6). Revisar justificación.</div>`:''}</div>
    <div class="card"><h2>Controles activos</h2>
      <div class="check"><div class="ci ${CFG.nivel_analisis==='profundo'?'warn':'ok'}">${CFG.nivel_analisis==='profundo'?'!':'✓'}</div><div><div class="ct">Nivel de análisis: ${CFG.nivel_analisis==='profundo'?'Profundo (OSINT)':'Básico'}</div><div class="cd">Se controla desde Configuración.</div></div></div>
      <div class="check"><div class="ci ok">✓</div><div><div class="ct">Consentimiento obligatorio</div><div class="cd">La verificación exige consentimiento del titular; las excepciones se marcan como violación.</div></div></div>
      <div class="check"><div class="ci ok">✓</div><div><div class="ct">Bitácora inmutable + trazabilidad</div><div class="cd">Cada consulta y verificación queda registrada con evaluador, persona y fecha.</div></div></div>
      <div class="check"><div class="ci ${conFlags?'warn':'ok'}">${conFlags?'!':'✓'}</div><div><div class="ct">Detección de mal uso</div><div class="cd">${conFlags?conFlags+' evento(s) con señal a revisar (volumen, repetición, sin consentimiento, horario).':'Sin patrones sospechosos.'}</div></div></div>
    </div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2>Bitácora de análisis de personas</h2><button class="btn ghost sm" id="audPDF">⬇ Exportar auditoría (PDF)</button></div>
    <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>Fecha</th><th>Evaluador</th><th>Persona analizada</th><th>Nivel</th><th>Consent.</th><th>Señales</th></tr></thead><tbody>
    ${rows.map(({e,f})=>`<tr style="${f.some(x=>x[0]==='red')?'background:#fdeaea55':''}"><td style="font-size:.8rem">${new Date(e.created_at).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(nombre(e))}</td><td>${esc(persona(e))}</td><td>${(e.detalle&&e.detalle.nivel)||'básico'}</td><td>${(e.detalle&&e.detalle.consentimiento===false)?'<span class="flag red">No</span>':'<span class="flag ok">Sí</span>'}</td><td>${f.map(x=>`<span class="flag ${x[0]}">${x[1]}</span>`).join('')||'—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#audPDF').onclick=()=>auditPDF(rows,nombre,persona);
}
function auditPDF(rows,nombre,persona){ const w=window.open('','_blank'); if(!w){toast('Permite ventanas emergentes.');return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Auditoría de análisis de personas — DEU</title><style>body{font-family:Inter,Arial,sans-serif;color:#0A1A30;padding:26px}h1{color:#062B5C;font-size:17px;margin:0}.sub{color:#6b7686;font-size:12px;margin:2px 0 14px}table{width:100%;border-collapse:collapse;font-size:10.5px}th{background:#062B5C;color:#fff;text-align:left;padding:6px 7px}td{padding:5px 7px;border-bottom:1px solid #e5e5e5}.gold{height:4px;background:#D5A021;width:60px;border-radius:2px;margin:4px 0 0}</style></head><body>
  <h1>Auditoría de uso responsable — Análisis de personas</h1><div class="gold"></div>
  <div class="sub">DEU · FES Iztacala, UNAM · Conforme a la LFPDPPP · Generado ${new Date().toLocaleString('es-MX')} · ${rows.length} eventos</div>
  <table><thead><tr><th>Fecha</th><th>Evaluador</th><th>Persona</th><th>Nivel</th><th>Consentimiento</th><th>Señales</th></tr></thead><tbody>
  ${rows.map(({e,f})=>`<tr><td>${new Date(e.created_at).toLocaleString('es-MX')}</td><td>${esc(nombre(e))}</td><td>${esc(persona(e))}</td><td>${(e.detalle&&e.detalle.nivel)||'básico'}</td><td>${(e.detalle&&e.detalle.consentimiento===false)?'NO':'Sí'}</td><td>${f.map(x=>x[1]).join(', ')||'—'}</td></tr>`).join('')}
  </tbody></table><script>window.onload=function(){setTimeout(function(){window.print();},250);}<\/script></body></html>`);
  w.document.close(); toast('Abriendo auditoría para PDF…');
}

/* ── SECCIÓN: Reportes ── */
function secReportes(V){
  V.innerHTML=`<div class="card"><h2>Reportes</h2><p class="muted" style="font-size:.84rem">Genera reportes con membrete de la DEU, exportables a PDF o Excel.</p>
   <div class="row" style="margin-top:12px;gap:8px;align-items:center">
     <select id="repTipo" class="mini"><option value="ejecutivo">Ejecutivo general</option><option value="padron">Padrón completo</option><option value="carrera">Por carrera</option></select>
     <select id="repCarrera" class="mini">${[...new Set(ADMIN_DATA.map(a=>a.carrera))].map(c=>`<option value="${c}">${CARRERA_LBL[c]||c}</option>`).join('')}</select>
     <button class="btn gold sm" id="repPDF">⬇ PDF</button><button class="btn ghost sm" id="repXls">⬇ Excel</button>
   </div>
   <div class="grid grid-4" style="margin-top:16px">
     <div class="stat"><div class="lbl">Total</div><div class="val">${ADMIN_DATA.length}</div></div>
     <div class="stat"><div class="lbl">Avalados</div><div class="val">${ADMIN_DATA.filter(a=>a.estado==='avalado').length}</div></div>
     <div class="stat"><div class="lbl">En proceso</div><div class="val">${ADMIN_DATA.filter(a=>a.estado.startsWith('en_revision')).length}</div></div>
     <div class="stat"><div class="lbl">Rechazados</div><div class="val">${ADMIN_DATA.filter(a=>a.estado==='rechazado').length}</div></div>
   </div></div>`;
  const rowsFor=()=>{const t=$('#repTipo').value,c=$('#repCarrera').value;return t==='carrera'?ADMIN_DATA.filter(a=>a.carrera===c):ADMIN_DATA;};
  $('#repXls').onclick=()=>exportExcel(rowsFor());
  $('#repPDF').onclick=()=>reportePDF($('#repTipo').value,$('#repCarrera').value);
}
function reportePDF(tipo,carrera){ const rows=tipo==='carrera'?ADMIN_DATA.filter(a=>a.carrera===carrera):ADMIN_DATA;
  const byE={}; rows.forEach(a=>byE[a.estado]=(byE[a.estado]||0)+1);
  const w=window.open('','_blank'); if(!w){toast('Permite ventanas emergentes.');return;}
  const titulo=tipo==='ejecutivo'?'Reporte ejecutivo':tipo==='carrera'?('Reporte · '+(CARRERA_LBL[carrera]||carrera)):'Padrón completo';
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${titulo} — DEU</title><style>body{font-family:Inter,Arial,sans-serif;color:#0A1A30;padding:26px}h1{color:#062B5C;font-size:18px;margin:0}.gold{height:4px;background:#D5A021;width:60px;border-radius:2px;margin:4px 0 12px}.sub{color:#6b7686;font-size:12px;margin-bottom:14px}.kpis{display:flex;gap:14px;margin:10px 0 18px}.kpi{border:1px solid #e5e5e5;border-radius:10px;padding:10px 14px}.kpi b{font-size:20px;color:#062B5C;display:block}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#062B5C;color:#fff;text-align:left;padding:7px 8px}td{padding:6px 8px;border-bottom:1px solid #e5e5e5}</style></head><body>
  <h1>${titulo} · Diplomados DEU</h1><div class="gold"></div>
  <div class="sub">División de Estudios Universitarios · FES Iztacala, UNAM · ${new Date().toLocaleDateString('es-MX')} · ${rows.length} actividades</div>
  <div class="kpis"><div class="kpi"><b>${rows.length}</b>Total</div><div class="kpi"><b>${byE.avalado||0}</b>Avalados</div><div class="kpi"><b>${(byE.en_revision_carrera||0)+(byE.en_revision_deu||0)}</b>En proceso</div><div class="kpi"><b>${byE.condicionado||0}</b>Condicionados</div><div class="kpi"><b>${byE.rechazado||0}</b>Rechazados</div></div>
  <table><thead><tr><th>Folio</th><th>Actividad</th><th>Tipo</th><th>Carrera</th><th>Horas</th><th>Estado</th></tr></thead><tbody>
  ${rows.map(a=>`<tr><td>${esc(a.folio)}</td><td>${esc(a.titulo)}</td><td>${TIPO_LBL[a.tipo]}</td><td>${CARRERA_LBL[a.carrera]}</td><td>${a.duracion_horas||'—'}</td><td>${ESTADO_LBL[a.estado]}</td></tr>`).join('')}
  </tbody></table><script>window.onload=function(){setTimeout(function(){window.print();},250);}<\/script></body></html>`);
  w.document.close(); toast('Abriendo reporte para PDF…');
}
function rowsForExport(rows){return rows.map(a=>({Folio:a.folio,Actividad:a.titulo,Tipo:TIPO_LBL[a.tipo],Carrera:CARRERA_LBL[a.carrera]||a.carrera,Horas:a.duracion_horas,Creditos:a.creditos,Estado:ESTADO_LBL[a.estado],Registro:(a.created_at||'').slice(0,10)}));}
function exportExcel(rows){ const data=rowsForExport(rows);
  const done=(X)=>{const ws=X.utils.json_to_sheet(data);const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Diplomados');X.writeFile(wb,'padron-diplomados-DEU.xlsx');toast('Excel generado ✓');};
  if(window.XLSX)return done(window.XLSX);
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>done(window.XLSX);
  s.onerror=()=>{const head=Object.keys(data[0]||{Folio:''});const csv=[head.join(',')].concat(data.map(r=>head.map(h=>'"'+(''+r[h]).replace(/"/g,'""')+'"').join(','))).join('\n');const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='padron-diplomados-DEU.csv';a.click();URL.revokeObjectURL(u);toast('Exportado como CSV');};
  document.head.appendChild(s);
}

/* ── SECCIÓN: Configuración ── */
function secConfig(V){
  const fuentes=CFG.fuentes||[];
  V.innerHTML=`
  <div class="grid grid-2">
    <div class="card"><h2>Nivel de análisis del responsable académico</h2>
      <p class="muted" style="font-size:.83rem">Controla qué tan profundo es el análisis de personas. El profundo activa OSINT (redes, fuentes legales) y exige mayores controles.</p>
      <div class="row" style="margin-top:10px;gap:8px">
        <button class="btn ${CFG.nivel_analisis==='basico'?'gold':'ghost'} sm" data-niv="basico">Básico (oficial + académico)</button>
        <button class="btn ${CFG.nivel_analisis==='profundo'?'gold':'ghost'} sm" data-niv="profundo">Profundo (OSINT)</button>
      </div>
      <div class="notice legal" style="margin-top:12px"><span class="ni">🔒</span><div>El nivel profundo se rige por la LFPDPPP: requiere consentimiento, deja bitácora y se somete a la auditoría de uso responsable.</div></div>
      <div class="divider"></div>
      <h3>Umbral de confianza para alerta</h3>
      <div class="slider-row"><label>Mínimo aceptable</label><input type="range" id="cfgUmbral" min="30" max="90" value="${CFG.umbral_confianza||60}"><span class="v" id="cfgUmbralV">${CFG.umbral_confianza||60}</span></div>
      <button class="btn navy sm" id="cfgSave" style="background:var(--navy);color:#fff;margin-top:8px">Guardar configuración</button>
    </div>
    <div class="card"><h2>Fuentes de verificación</h2><p class="muted" style="font-size:.83rem">Activa o define las fuentes que consulta la verificación del RAA.</p>
      <div id="fuentesList" style="margin-top:8px">${fuentes.map((f,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b style="font-size:.86rem">${esc(f.nombre)}</b><div style="font-size:.72rem;color:#8a97a8">${f.cat}${f.base?' · base':''}</div></div><label style="font-size:.8rem"><input type="checkbox" data-fsrc="${i}" ${f.on?'checked':''} ${f.base?'disabled':''} style="width:auto"> activa</label></div>`).join('')}</div>
      <div class="row" style="margin-top:10px;gap:6px"><input id="fNom" class="mini" style="flex:1" placeholder="Nueva fuente (nombre)"><input id="fUrl" class="mini" style="flex:1" placeholder="URL/API (opcional)"><button class="btn ghost sm" id="fAdd">+ Agregar</button></div>
    </div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2>Gestión de usuarios</h2><span class="muted" style="font-size:.8rem">${PERFILES.length} usuarios</span></div>
    <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Carrera</th><th>Activo</th><th></th></tr></thead><tbody>
    ${PERFILES.map(p=>`<tr data-uid="${p.id}"><td>${esc(p.nombre)}</td><td style="font-size:.8rem">${esc(p.correo)}</td>
      <td><select class="mini u-rol"><option value="registrante">Registrante</option><option value="comite_carrera">Comité carrera</option><option value="comite_deu">Comité DEU</option><option value="admin">Admin</option></select></td>
      <td><select class="mini u-car"><option value="">—</option>${Object.entries(CARRERA_LBL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></td>
      <td><input type="checkbox" class="u-act" ${p.activo!==false?'checked':''} style="width:auto"></td>
      <td><button class="btn ghost sm u-save">Guardar</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="notice info" style="margin-top:10px"><span>ℹ</span><div>Las cuentas se crean cuando la persona se registra en el portal; aquí asignas su rol y carrera.</div></div>
  </div>`;
  V.querySelectorAll('[data-niv]').forEach(b=>b.onclick=()=>{CFG.nivel_analisis=b.dataset.niv;V.querySelectorAll('[data-niv]').forEach(x=>{x.classList.toggle('gold',x.dataset.niv===CFG.nivel_analisis);x.classList.toggle('ghost',x.dataset.niv!==CFG.nivel_analisis);});});
  $('#cfgUmbral').oninput=()=>$('#cfgUmbralV').textContent=$('#cfgUmbral').value;
  V.querySelectorAll('[data-fsrc]').forEach(c=>c.onchange=()=>{CFG.fuentes[+c.dataset.fsrc].on=c.checked;});
  $('#fAdd').onclick=()=>{const n=$('#fNom').value.trim();if(!n)return;CFG.fuentes=CFG.fuentes||[];CFG.fuentes.push({id:'custom_'+Date.now(),nombre:n,cat:'personalizada',on:true,url:$('#fUrl').value.trim()});secConfig(V);};
  $('#cfgSave').onclick=async()=>{try{const {error}=await DEU().from('config').update({nivel_analisis:CFG.nivel_analisis,fuentes:CFG.fuentes,umbral_confianza:+$('#cfgUmbral').value,updated_at:new Date().toISOString()}).eq('id',1);if(error)throw error;toast('Configuración guardada ✓');}catch(e){toast('Error: '+(e.message||e));}};
  // set current rol/carrera per row + save
  V.querySelectorAll('tr[data-uid]').forEach(tr=>{const p=PERFILES.find(x=>x.id===tr.dataset.uid);if(!p)return;tr.querySelector('.u-rol').value=p.rol;tr.querySelector('.u-car').value=p.carrera||'';
    tr.querySelector('.u-save').onclick=async()=>{try{const {error}=await DEU().from('perfiles').update({rol:tr.querySelector('.u-rol').value,carrera:tr.querySelector('.u-car').value||null,activo:tr.querySelector('.u-act').checked}).eq('id',p.id);if(error)throw error;toast('Usuario actualizado ✓');}catch(e){toast('Error: '+(e.message||e));}};});
}

boot();
</script>

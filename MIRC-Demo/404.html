<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BASE HREF — ancla la resolución de URLs relativas a la carpeta del
         demo, sin importar a qué ruta interna (ej. /expediente/X/resumen)
         haya navegado el SPA. Sin esto, history.replaceState cambia el
         baseURI y los <script src="assets/..."> fallan con MIME error porque
         GitHub Pages devuelve 404.html (HTML) en vez del JS. -->
    <base href="/ecosistema-digital/MIRC-Demo/" />

    <link rel="icon" type="image/png" href="/ecosistema-digital/MIRC-Demo/assets/MIRCLogo.png" />
    <title>MIRC Expediente 360 — DEMO · FES Iztacala UNAM</title>
    <meta name="description" content="Demostración interactiva del Expediente Clínico Electrónico MIRC desarrollado por FES Iztacala UNAM. Datos ficticios.">

    <!-- ═══════════════════════════════════════════════════════════════════
         SPA Fallback decoder — pareja del 404.html del root del repo.
         Cuando GitHub Pages redirige una URL como /MIRC-Demo/dashboard
         hacia /MIRC-Demo/?p=/dashboard, este script restaura la URL real
         antes de que React Router lea history.location.
         IMPORTANTE: el <base href> de arriba garantiza que los <script>
         siguientes siempre resuelvan contra /MIRC-Demo/, no contra la URL
         restaurada (que incluye /expediente/X/...). ═══════════════════════ -->
    <script>
      (function () {
        var s = location.search;
        if (!s) return;
        var params = new URLSearchParams(s);
        var p = params.get('p'); // ruta interna codificada por 404.html
        var q = params.get('q'); // query string original
        if (p) {
          var restoredUrl = location.pathname.replace(/\/$/, '') + p + (q ? '?' + q : '') + location.hash;
          history.replaceState(null, '', restoredUrl);
        }
      })();
    </script>

    <!-- DEMO MOCKS — interceptor de fetch + auto-login Dra. Vega -->
    <!-- Paths ABSOLUTOS para ser inmunes al baseURI cambiante -->
    <script src="/ecosistema-digital/MIRC-Demo/demo-mocks.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.9.1/dist/livekit-client.umd.js"></script>

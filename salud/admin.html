<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · CUSMSR FES Iztacala</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Three.js servido desde el propio repo: sin CDN de terceros, sin fugar a quien
     visita el panel, y funciona aunque la red de la Facultad filtre dominios. -->
<script src="../public/vendor/three.min.js" defer></script>
<link rel="icon" href="../public/assets/CUSMSR-emblem.png" type="image/png">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PALETA
   Marca: lila / rosa / azul (misma del sitio público).
   Series de datos: tema categórico propio, validado con el validador de la
   guía de visualización — las 6 comprobaciones pasan en claro y en oscuro.
   El violeta encabeza porque es el que más se acerca al lila de la marca.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --lila-50:#F7F3FF;--lila-100:#EDE5FF;--lila-200:#DBCCFF;--lila-300:#C4AEF8;
  --lila-400:#A98BF0;--lila-500:#8E68E4;--lila-600:#7549CE;--lila-700:#5C37A6;
  --rosa-100:#FCE5F1;--rosa-200:#F8CCE2;--rosa-500:#D4629B;--rosa-600:#B54A80;--rosa-700:#933765;
  --azul-50:#F0F9FE;--azul-100:#DDF0FB;--azul-200:#BFE3F6;--azul-600:#2A7BA8;--azul-700:#1E6187;

  --bg:#FAF8FE; --surface-1:#FFFFFF; --surface-2:#F7F3FF;
  --text-primary:#2A2340; --text-secondary:#544E70; --text-muted:#726A8E;
  --line:#EEEAF7; --line-2:#E3DCF2;

  /* categóricas — orden fijo, nunca cíclico */
  --series-1:#4A3AA7; --series-2:#EDA100; --series-3:#2A78D6;
  --series-4:#1BAF7A; --series-5:#EB6834;
  /* secuencial: un solo tono, claro → oscuro */
  --seq-1:#EDE5FF;--seq-2:#C4AEF8;--seq-3:#8E68E4;--seq-4:#5C37A6;--seq-5:#3A2170;
  /* estado — reservados, nunca se reutilizan como serie */
  --ok:#1B7F4F; --warn:#B07100; --serious:#C0562A; --critical:#B3243F;

  --grid:#EDEAF6; --axis:#B9B2CE;
  --sh-1:0 1px 3px rgba(42,35,64,.05);--sh-2:0 6px 22px rgba(42,35,64,.09);
  --sh-3:0 18px 48px rgba(42,35,64,.14);
  --r:14px;--r-lg:20px;--r-full:999px;
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15121F; --surface-1:#1D1930; --surface-2:#241F3B;
  --text-primary:#F2EFFA; --text-secondary:#C3BDD8; --text-muted:#948CB0;
  --line:#2C2645; --line-2:#372F52;
  --series-1:#9085E9; --series-2:#C98500; --series-3:#3987E5;
  --series-4:#199E70; --series-5:#D95926;
  --seq-1:#2A2247;--seq-2:#41337A;--seq-3:#6B51B8;--seq-4:#9C82E8;--seq-5:#C9B6FA;
  --ok:#37B375; --warn:#D9A521; --serious:#E5794A; --critical:#E5566F;
  --grid:#2A2444; --axis:#5A527A;
  --lila-50:#241F3B;--lila-100:#2C2549;--lila-700:#C4AEF8;
  --azul-50:#1B2434;--azul-100:#22314A;--azul-700:#8FC4E8;
  --rosa-100:#332030;--rosa-700:#F0A8C8;
  --sh-1:0 1px 3px rgba(0,0,0,.4);--sh-2:0 6px 22px rgba(0,0,0,.45);--sh-3:0 18px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text-secondary);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--text-primary);line-height:1.2;font-weight:600}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--lila-700)}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--series-1);outline-offset:2px;border-radius:6px}
table{border-collapse:collapse;width:100%}

/* ── Acceso ─────────────────────────────────────────────── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 20% 0%,var(--lila-100),transparent 62%),var(--bg)}
.login-card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:34px;max-width:400px;width:100%;box-shadow:var(--sh-3)}
.login-card img{height:78px;margin:0 auto 18px}
.login-card h1{font-size:22px;text-align:center;margin-bottom:6px}
.login-card p.sub{text-align:center;font-size:13.5px;color:var(--text-muted);margin-bottom:24px}

/* ── Estructura ─────────────────────────────────────────── */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:250px 1fr}
aside{background:var(--surface-1);border-right:1px solid var(--line);padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand img{height:34px}
.brand b{font-size:13.5px;color:var(--text-primary);line-height:1.25}
.brand span{display:block;font-size:11px;color:var(--text-muted);font-weight:400}
.grp{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-muted);padding:14px 10px 7px}
aside nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:var(--text-secondary);text-align:left;transition:.2s}
aside nav button:hover{background:var(--surface-2);color:var(--text-primary)}
aside nav button.on{background:var(--lila-100);color:var(--lila-700);font-weight:650}
aside nav button .i{width:18px;text-align:center;flex-shrink:0;font-size:14px}
aside nav button.lock{opacity:.35;cursor:not-allowed}

main{padding:0 0 60px;min-width:0}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 28px;
  display:flex;align-items:center;gap:14px}
.bar h1{font-size:19px}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{padding:6px 13px;border-radius:var(--r-full);font-size:12px;font-weight:650;
  background:var(--lila-100);color:var(--lila-700)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:var(--surface-1);border:1px solid var(--line);font-size:15px;transition:.2s}
.icon-btn:hover{background:var(--surface-2)}
.wrap{padding:24px 28px;max-width:1240px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;
  border-radius:10px;font-size:13.5px;font-weight:600;transition:.22s;border:1px solid transparent}
.btn-1{background:var(--lila-600);color:#fff}
.btn-1:hover{background:var(--lila-700)}
.btn-2{background:var(--surface-1);color:var(--text-primary);border-color:var(--line-2)}
.btn-2:hover{background:var(--surface-2)}
.btn-d{background:transparent;color:var(--critical);border-color:var(--critical)}
.btn-sm{padding:7px 13px;font-size:12.5px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--text-primary);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border-radius:10px;
  border:1px solid var(--line-2);font-size:14px;font-family:inherit;color:var(--text-primary);
  background:var(--surface-1)}
.field input:focus,.field select:focus{outline:none;border-color:var(--series-1);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--series-1) 18%,transparent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* ── Mapa de temas en 3D ─────────────────────────────────── */
#g3d{position:relative;width:100%;height:min(66vh,560px);border-radius:var(--r);
  background:#fff;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:grab}
#g3d.arrastrando{cursor:grabbing}
#g3d canvas{display:block;width:100%;height:100%}
#g3d .eti{position:absolute;transform:translate(-50%,-50%);pointer-events:none;
  font-size:12.5px;font-weight:650;color:var(--text-primary);white-space:nowrap;
  text-shadow:0 1px 3px #fff,0 -1px 3px #fff,1px 0 3px #fff,-1px 0 3px #fff;
  transition:opacity .2s}
#g3d .pista{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:var(--text-muted);
  background:rgba(255,255,255,.86);padding:5px 11px;border-radius:999px;pointer-events:none}
#g3d .sinwebgl{display:flex;align-items:center;justify-content:center;height:100%;
  padding:30px;text-align:center;font-size:13.5px;color:var(--text-muted);line-height:1.65}
.g-ficha{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
  background:var(--surface-1);min-height:150px}
.g-ficha .vacia{color:var(--text-muted);font-size:13.5px;line-height:1.65}
.g-ficha h4{font-family:Inter,sans-serif;font-size:17px;font-weight:700;margin-bottom:3px;
  display:flex;align-items:center;gap:9px}
.g-ficha h4 i{width:13px;height:13px;border-radius:50%;flex:none;display:block}
.g-ficha .kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.g-ficha .kv:last-of-type{border-bottom:none}
.g-ficha .kv b{font-variant-numeric:tabular-nums;color:var(--text-primary)}
.g-ficha .conq{margin-top:12px;font-size:12.5px;color:var(--text-secondary);line-height:1.7}
.g-ficha .conq b{color:var(--text-primary)}
.g-leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:13px}
.g-leyenda span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary)}
.g-leyenda i{width:12px;height:12px;border-radius:50%;display:block}
/* ── Filtros ────────────────────────────────────────────── */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:20px;
  padding:12px 15px;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r)}
.filters .lbl{font-size:12px;font-weight:650;color:var(--text-muted);margin-right:3px}
.seg{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--text-secondary)}
.seg button.on{background:var(--surface-1);color:var(--lila-700);font-weight:700;box-shadow:var(--sh-1)}

/* ── Tarjetas ───────────────────────────────────────────── */
.grid{display:grid;gap:16px;margin-bottom:20px}
.g4{grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card.pad{padding:20px 22px}
.tile .k{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:9px}
.tile .v{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--text-primary);
  line-height:1;margin-bottom:6px;letter-spacing:-.02em}
.tile .s{font-size:12.5px;color:var(--text-muted);line-height:1.45}
.tile .d{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;margin-top:7px}
.d.up{color:var(--ok)}.d.dn{color:var(--serious)}

.chart-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.chart-head h3{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;color:var(--text-primary)}
.chart-head .why{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.5}
.chart-head .tools{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.tgl{padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:650;color:var(--text-muted);
  border:1px solid var(--line-2);background:var(--surface-1)}
.tgl.on{background:var(--lila-100);color:var(--lila-700);border-color:transparent}

.legend{display:flex;gap:15px;flex-wrap:wrap;margin:12px 0 4px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-secondary)}
.legend i{width:11px;height:11px;border-radius:3px;display:block;flex-shrink:0}

.tbl{margin-top:12px;font-size:13px;display:none}
.tbl.on{display:block}
.tbl th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);padding:8px 10px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--text-secondary)}
.tbl td:first-child{color:var(--text-primary);font-weight:600}
.tbl tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* supresión por k-anonimato: se MUESTRA, no se esconde */
.supr{display:flex;align-items:flex-start;gap:11px;background:var(--surface-2);
  border:1px dashed var(--line-2);border-radius:11px;padding:12px 15px;font-size:12.5px;
  color:var(--text-muted);line-height:1.55;margin-top:12px}
.supr b{color:var(--text-secondary)}

/* tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--text-primary);color:var(--surface-1);padding:9px 12px;border-radius:9px;
  font-size:12.5px;line-height:1.5;box-shadow:var(--sh-2);max-width:250px}
#tip.on{opacity:1}
#tip b{display:block;font-size:13px;margin-bottom:3px}

/* preguntas */
.q{padding:15px 17px;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px}
.q .txt{font-size:14.5px;color:var(--text-primary);line-height:1.55;margin-bottom:10px}
.q .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--text-muted)}
.tag{padding:3px 10px;border-radius:var(--r-full);font-size:11px;font-weight:700;
  background:var(--lila-100);color:var(--lila-700)}
.tag.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.c{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)}

.note{display:flex;gap:12px;padding:15px 17px;border-radius:var(--r);font-size:13px;line-height:1.6;margin-bottom:18px}
.note .ic{font-size:17px;flex-shrink:0}
.note.info{background:var(--azul-50);border:1px solid var(--azul-200);color:var(--azul-700)}
.note.lock{background:var(--lila-50);border:1px solid var(--lila-200);color:var(--lila-700)}
.note b{display:block;margin-bottom:3px}
.note.warn{background:color-mix(in srgb,var(--warn) 11%,var(--surface-1));
  border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);color:var(--warn)}
.note.ok{background:color-mix(in srgb,var(--ok) 10%,var(--surface-1));
  border:1px solid color-mix(in srgb,var(--ok) 32%,transparent);color:var(--ok)}
.note.critical{background:color-mix(in srgb,var(--critical) 10%,var(--surface-1));
  border:1px solid color-mix(in srgb,var(--critical) 34%,transparent);color:var(--critical)}
.note.warn b,.note.ok b,.note.critical b{color:inherit}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
/* Entradas sueltas del Laboratorio: el chat del ensayo y los supuestos */
#lcTexto,input[data-coef]{padding:10px 13px;border-radius:10px;background:var(--surface-1);
  border:1px solid var(--line-2);color:var(--text-primary);font:inherit;font-size:13.5px}
#lcTexto:focus,input[data-coef]:focus{outline:none;border-color:var(--series-1);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--series-1) 18%,transparent)}
input[data-coef]{padding:6px 9px;font-size:12.5px}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

.view{display:none}.view.on{display:block}
.deny{text-align:center;padding:70px 20px;color:var(--text-muted)}
.deny .big{font-size:40px;margin-bottom:14px}

@media(max-width:940px){
  #app.on{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  aside nav{display:flex;gap:5px;overflow-x:auto}
  aside nav button{white-space:nowrap;width:auto}
  .grp{display:none}
  .wrap,.bar{padding-left:18px;padding-right:18px}
  .f2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div id="tip"></div>

<!-- ══════════ ACCESO ══════════ -->
<div id="login">
  <form class="login-card" id="loginForm">
    <img src="../public/assets/CUSMSR-logo.png" alt="CUSMSR">
    <h1>Panel del Centro</h1>
    <p class="sub">Acceso para personal designado</p>
    <div class="field">
      <label for="lUser">Identificador o correo</label>
      <input type="text" id="lUser" placeholder="admin@ecosistemadigital.unam.mx" autocomplete="off">
    </div>
    <div class="field">
      <label for="lPass">Contraseña</label>
      <input type="password" id="lPass" autocomplete="off">
    </div>
    <div class="field" id="rolDemo" style="display:none">
      <label for="lRole">Entrar como <span style="font-weight:400;color:var(--text-muted)">(sólo en demostración)</span></label>
      <select id="lRole">
        <option value="admin">Administración</option>
        <option value="coordinacion">Coordinación</option>
        <option value="analitica">Analítica</option>
        <option value="clinico">Equipo clínico</option>
        <option value="docencia">Docencia</option>
      </select>
    </div>
    <button type="submit" class="btn btn-1" style="width:100%">Entrar</button>
    <p style="margin-top:16px;font-size:11.5px;color:var(--text-muted);line-height:1.55;text-align:center">
      Cada consulta al banco de preguntas queda registrada con tu identificador.
    </p>
  </form>
</div>

<!-- ══════════ PANEL ══════════ -->
<div id="app">
  <aside>
    <div class="brand">
      <img src="../public/assets/CUSMSR-emblem.png" alt="">
      <b>CUSMSR<span>Panel del Centro</span></b>
    </div>
    <nav id="menu"></nav>
  </aside>

  <main>
    <div class="bar">
      <h1 id="titulo">Tablero</h1>
      <div class="right">
        <span class="chip" id="chipRol"></span>
        <button class="icon-btn" id="btnTema" title="Cambiar tema">☾</button>
        <button class="icon-btn" id="btnSalir" title="Salir">↪</button>
      </div>
    </div>
    <div class="wrap" id="contenido"></div>
  </main>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>new Intl.NumberFormat('es-MX').format(n);
// null no es cero: significa que esa cohorte todavia no junta el minimo de
// personas. Pintarlo como 0% seria inventar una caida que no ocurrio.
const pct=n=>(n===null||n===undefined||Number.isNaN(n))?'—':(+n).toFixed(1).replace('.0','')+'%';
const MIN_N = 10;  // espejo de cusmsr.min_n()

/* ═══════════════════════════════════════════════════════════════════
   ROLES Y PERMISOS
   Adaptado del modelo de Aura, con una diferencia deliberada:
   NO existe un permiso "ver_individual". No hay pantalla, ni consulta,
   ni exportación que devuelva la fila de una persona. La continuidad
   clínica va por el expediente; el puente lo hace la propia alumna con
   su hoja de "preparar consulta".
   ═══════════════════════════════════════════════════════════════════ */
const PERMISOS = {
  ver_agregados:       'KPIs y gráficas agregadas, siempre con k ≥ ' + MIN_N,
  ver_preguntas:       'Banco de preguntas disociadas (único texto libre del sistema)',
  ver_insights:        'Lecturas generadas por IA sobre los agregados',
  exportar:            'Descargar agregados en CSV',
  gestionar_contenido: 'Catálogos, respuestas guardadas y materiales',
  gestionar_usuarios:  'Alta y baja de personal y sus roles',
  gestionar_config:    'Umbral de k-anonimato, retención, parámetros',
  gestionar_seguridad: 'Auditoría de accesos, abuso, bloqueos de red',
  gestionar_agenda:    'Bandeja de solicitudes de atención y su resolución',

const num = v => (v === null || v === undefined) ? null : +v;

function adaptar(r){
  // fn_metrics devuelve ok=false cuando la cohorte filtrada no llega al umbral.
  // No es un error: es la respuesta correcta. Se conserva el tamaño para poder
  // decir en pantalla POR QUÉ no hay gráficas, en vez de dejar cajas vacías.
  if (r && r.ok === false){
    return { ...vacio(), cohorte:r.filtros?.cohorte ?? 0, cohorteCorta:true };
  }
  const pivot = {};
  (r.temasMes||[]).forEach(x=>{
    const m = String(x.mes).slice(0,7);
    (pivot[m] = pivot[m] || { m })[x.topic] = x.preguntas;
  });
  const e = r.embudo || {};
  return {
    cohorte: r.filtros?.cohorte ?? (r.actividad?.cuentas ?? 0),
    cohorteCorta: false,
    kpis:{ registradas:r.actividad?.cuentas ?? 0, activas30:r.actividad?.activas_30d ?? 0,
           citas:e.solicitaron_cita ?? 0, atendidas:e.fueron_atendidas ?? 0,
           seguimiento:e.con_seguimiento ?? 0 },
    embudo:[
      { k:'Se registraron',            v:e.registradas ?? 0 },
      { k:'Usan el seguimiento',       v:e.usan_seguimiento ?? 0 },
      { k:'Solicitaron cita',          v:e.solicitaron_cita ?? 0 },
      { k:'Fueron atendidas',          v:e.fueron_atendidas ?? 0 },
      { k:'Con seguimiento a 3 meses', v:e.con_seguimiento ?? 0 },
    ],
    metodos:(r.metodos||[]).map(x=>({ k:eti(x.method), v:+x.personas })),
    continuidad:(r.continuidad||[]).map(x=>({ k:eti(x.method), c:+x.cohorte,
      c3:+x.cohorte_3m, c6:+x.cohorte_6m, c12:+x.cohorte_12m,
      m3:num(x.pct_3m), m6:num(x.pct_6m), m12:num(x.pct_12m) })),
    abandono:(r.abandono||[]).map(x=>({ k:eti(x.end_reason), v:+x.casos })),
    menstrual:{ personas:r.menstrual?.personas ?? 0, dolorSevero:+(r.menstrual?.pct_dolor_severo ?? 0),
      faltoClase:+(r.menstrual?.pct_falto_clase ?? 0), diasProm:+(r.menstrual?.dias_perdidos_prom ?? 0),
      ciclosProm:+(r.menstrual?.ciclos_prom ?? 0),
      dolor:(r.dolor||[]).map(x=>({ k:x.rango, v:+x.personas })) },
    tamizaje:(r.tamizaje||[]).map(x=>({ k:eti(x.test_type), v:+x.pruebas,
      centro:+x.en_el_centro, venc:+x.vencidas })),
    ventana:(r.ventana||[]).map(x=>({ m:String(x.mes).slice(0,7), e:+x.eventos, a:+x.actuaron })),
    temasMes:Object.values(pivot).sort((a,b)=>a.m<b.m?-1:1)
      .map(o=>({ anticoncepcion:0, menstrual:0, its:0, embarazo:0, ...o })),
    suprimidos:(r.suprimidos||[]).map(x=>({ d:x.dimension, c:eti(x.categoria) })),
    preguntas:[], cuarentena:[], accesos:[], abuso:[], personal:[],
  };
}

const SIN_DATOS = (msg = 'Todavía no hay suficientes datos para mostrar esto.') =>
  `<div style="padding:44px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;

function tabla(cols, filas){
  if (!filas || !filas.length) return SIN_DATOS('Sin filas que mostrar.');
  return `<table><thead><tr>${cols.map((c,i)=>`<th class="${i?'num':''}">${c}</th>`).join('')}</tr></thead>
    <tbody>${filas.map(f=>`<tr>${f.map((c,i)=>`<td class="${i?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

// Barras horizontales — una sola serie, etiqueta directa en cada barra
function barrasH(datos, {color='var(--series-1)', unidad=''}={}){
  if (!datos || !datos.length) return SIN_DATOS();
  const max=Math.max(...datos.map(d=>d.v)), h=34, W=760, L=178, R=64;
  const alto=datos.length*h+8;
  return `<svg viewBox="0 0 ${W} ${alto}" style="width:100%;height:auto" role="img">
    ${datos.map((d,i)=>{
      const y=i*h+7, w=Math.max(3,(d.v/max)*(W-L-R));
      return `<g class="hit" data-tip="<b>${d.k}</b>${fmt(d.v)}${unidad}">
        <text x="${L-12}" y="${y+13}" text-anchor="end" font-size="12.5" fill="var(--text-secondary)">${d.k}</text>
        <rect x="${L}" y="${y}" width="${w}" height="19" rx="4" fill="${color}"/>
        <text x="${L+w+9}" y="${y+13.5}" font-size="12" font-weight="700" fill="var(--text-primary)"
          font-variant-numeric="tabular-nums">${fmt(d.v)}${unidad}</text>
        <rect x="0" y="${y-3}" width="${W}" height="25" fill="transparent"/></g>`;
    }).join('')}</svg>`;
}

// Barras agrupadas — varias series, con leyenda
function barrasG(datos, series){
  if (!datos || !datos.length) return SIN_DATOS();
  const W=760,L=44,T=14,R=12;
  const B=datos.length>6?96:54, H=datos.length>6?306:260;
  const gw=(W-L-R)/datos.length, bw=Math.min(21,(gw-16)/series.length);
  const max=100;
  const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,25,50,75,100];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
    ${ticks.map(t=>`<g><line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${L-9}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${t}%</text></g>`).join('')}
    ${datos.map((d,i)=>{
      const x0=L+i*gw+(gw-bw*series.length-4*(series.length-1))/2;
      return series.map((s,j)=>{
        const v=d[s.k], x=x0+j*(bw+4);
        // Sin barra cuando no hay dato: una barra de altura cero se lee como
        // "cayo a cero", que es justo lo contrario de "todavia no sabemos".
        if (v === null || v === undefined) return `<g class="hit"
          data-tip="<b>${d.k}</b>${s.t}: sin cohorte suficiente todavía">
          <rect x="${x}" y="${y(0)-3}" width="${bw}" height="3" rx="1.5"
                fill="var(--line-2)"/></g>`;
        const yy=y(v);
        return `<g class="hit" data-tip="<b>${d.k}</b>${s.t}: ${pct(v)} · cohorte ${
          s.k==='m3'?d.c3:s.k==='m6'?d.c6:s.k==='m12'?d.c12:d.c}">
          <rect x="${x}" y="${yy}" width="${bw}" height="${y(0)-yy}" rx="4" fill="${s.c}"/></g>`;
      }).join('') +
      // Con más de seis categorías las etiquetas horizontales se encabalgan.
      // Se giran en lugar de recortarlas: un nombre de método a medias no dice
      // cuál método es.
      (datos.length > 6
        ? `<g transform="translate(${L+i*gw+gw/2},${H-B+16}) rotate(-32)">
             <text text-anchor="end" font-size="11" fill="var(--text-secondary)">${d.k}</text>
             <text text-anchor="end" font-size="10" dy="12"
                   fill="var(--text-muted)">n=${d.c}</text></g>`
        : `<text x="${L+i*gw+gw/2}" y="${H-B+20}" text-anchor="middle" font-size="11.5"
             fill="var(--text-secondary)">${d.k}</text>
           <text x="${L+i*gw+gw/2}" y="${H-B+35}" text-anchor="middle" font-size="10.5"
             fill="var(--text-muted)">n=${d.c}</text>`);
    }).join('')}
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/></svg>`;
}

// Líneas — varias series, con marcadores y leyenda
function lineas(datos, series, campoX='m'){
  if (!datos || !datos.length) return SIN_DATOS();
  const W=760,H=250,L=42,B=38,T=14,R=14;
  const max=Math.ceil(Math.max(...datos.flatMap(d=>series.map(s=>d[s.k])))/20)*20;
  const x=i=>L+(W-L-R)*(datos.length===1?0.5:i/(datos.length-1));
  const y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,max/4,max/2,max*3/4,max];
  const mes=m=>['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m.slice(5,7)];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
    ${ticks.map(t=>`<g><line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${L-9}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${t}</text></g>`).join('')}
    ${datos.map((d,i)=>`<text x="${x(i)}" y="${H-B+21}" text-anchor="middle" font-size="11.5"
       fill="var(--text-secondary)">${mes(d[campoX])}</text>`).join('')}
    ${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" points="${datos.map((d,i)=>`${x(i)},${y(d[s.k])}`).join(' ')}"/>`).join('')}
    ${series.map(s=>datos.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[s.k])}" r="4.5" fill="${s.c}"
       stroke="var(--surface-1)" stroke-width="2"/>`).join('')).join('')}
    ${series.map(s=>{const d=datos[datos.length-1];
       return `<text x="${x(datos.length-1)+8}" y="${y(d[s.k])+4}" font-size="11.5" font-weight="700"
         fill="var(--text-primary)">${d[s.k]}</text>`;}).join('')}
    ${datos.map((d,i)=>`<rect class="hit" x="${x(i)-((W-L-R)/datos.length)/2}" y="${T}"
       width="${(W-L-R)/datos.length}" height="${H-T-B}" fill="transparent"
       data-tip="<b>${mes(d[campoX])}</b>${series.map(s=>`${s.t}: ${d[s.k]}`).join('<br>')}"/>`).join('')}
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/></svg>`;
}

// Embudo — una serie, con la caída entre pasos
function embudo(datos){
  if (!datos || !datos.length) return SIN_DATOS();
  const W=760,h=52,max=datos[0].v;
  return `<svg viewBox="0 0 ${W} ${datos.length*h+6}" style="width:100%;height:auto" role="img">
    ${datos.map((d,i)=>{
      const y=i*h+6, w=(d.v/max)*(W-250), prev=i?datos[i-1].v:null;
      const caida=prev?Math.round((1-d.v/prev)*100):null;
      return `<g class="hit" data-tip="<b>${d.k}</b>${fmt(d.v)} personas${caida!==null?` · ${caida}% menos que el paso anterior`:''}">
        <text x="0" y="${y+21}" font-size="13" fill="var(--text-secondary)">${d.k}</text>
        <rect x="190" y="${y+6}" width="${Math.max(4,w)}" height="26" rx="4" fill="var(--seq-${5-i>0?5-i:1})"/>
        <text x="${190+Math.max(4,w)+10}" y="${y+24}" font-size="13.5" font-weight="700"
          fill="var(--text-primary)" font-variant-numeric="tabular-nums">${fmt(d.v)}</text>
        ${caida!==null?`<text x="${W-4}" y="${y+24}" text-anchor="end" font-size="12" font-weight="650"
          fill="${caida>=40?'var(--serious)':'var(--text-muted)'}">−${caida}%</text>`:''}
        <rect x="0" y="${y}" width="${W}" height="${h-4}" fill="transparent"/></g>`;
    }).join('')}</svg>`;
}

function leyenda(series){
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.t}</span>`).join('')}</div>`;
}
function nSuprimidos(lista){
  if(!lista.length) return '';
  return `<div class="supr"><span>⊘</span><div><b>${lista.length} categoría(s) oculta(s) por el umbral de k-anonimato.</b>
    ${lista.map(s=>s.c).join(' · ')}.
    Se nombran para que sepas que existen y no leas la gráfica como si fuera todo — pero el
    conteo no se muestra: por debajo de ${MIN_N} personas una celda puede identificar a alguien.</div></div>`;
}

function pintarMenu(){

    ? `<div class="grp">${m.g}</div>`

let vistaActual = null;

function ir(v, conservarScroll){
  if(!v){ $('#contenido').innerHTML = `<div class="deny"><div class="big">⛨</div>
    <b style="color:var(--text-primary)">Tu rol no tiene acceso a ninguna sección de datos.</b>
    <p style="margin-top:8px">Habla con quien administra el panel.</p></div>`; return; }
  const m = MENU.find(x => x.v === v);
  vistaActual = v;
  $$('#menu button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#titulo').textContent = m.t;
  $('#contenido').innerHTML = puede(m.p) ? VISTAS[v]()
    : `<div class="deny"><div class="big">⛨</div>
       <b style="color:var(--text-primary)">No tienes acceso a esta sección.</b>
       <p style="margin-top:8px">Requiere el permiso <code>${m.p}</code>.
       Tu rol es ${ROLES[sesion.rol].nombre}.</p></div>`;
  if (v === 'preguntas')   pintarPreguntas('todas');
  if (v === 'contenido')   pintarMetodos();
  if (v === 'agenda')      pintarActividades();
  if (v === 'solicitudes') pintarCola();
  if (v === 'config')      pintarDemo();
  if (v === 'grafo')       pintarGrafo();
  if (v === 'comunidad')   pintarComunidad();
  if (v === 'lmensaje' || v === 'l72h') prepararLab();
  conectar();
  if (!conservarScroll) scrollTo({ top:0 });
}

// Cambiar el filtro no cambia de vista: recalcula en la base y vuelve a pintar
// lo que ya estaba en pantalla, sin brincar al inicio.
async function aplicarFiltro(campo, valor){
  if (FILTRO[campo] === valor) return;
  FILTRO[campo] = valor;
  cargandoFiltro = true;
  ir(vistaActual, true);
  try {
    M = DEMO ? { ...D, cohorte:D.kpis.registradas, cohorteCorta:false }
             : adaptar(await api({ action:'metrics', meses:FILTRO.meses, area:FILTRO.area }));
  } catch (err) {
    alert(err.message === 'demo' ? 'Sin conexión configurada.' : err.message);
  } finally {
    cargandoFiltro = false;
    ir(vistaActual, true);
  }
}

// MAPA DE TEMAS EN 3D
//
// Three.js sólo para dibujar. El acomodo y el control de cámara son propios:
// una dependencia menos y funciona igual con dedo que con ratón.
//
// Los seis colores pasan las cinco pruebas del validador de paleta, incluida
// la separación bajo daltonismo (peor par ΔE 9.6 deutan). Aun así cada esfera
// lleva su nombre escrito al lado: el color acompaña, no informa solo.
// ═══════════════════════════════════════════════════════════════════
const G_COLOR = {
  anticoncepcion:'#9B7BF0', menstrual:'#E87BA8', its:'#4FAFDC',
  embarazo:'#EE9450', sexualidad:'#3FBE9B', servicios:'#D4AE3C',
};
const G_NOMBRE = {
  anticoncepcion:'Anticoncepción', menstrual:'Salud menstrual', its:'ITS',
  embarazo:'Embarazo', sexualidad:'Sexualidad', servicios:'Servicios del Centro',
};
const G_COLOR_OTRO = '#A9A2BC';
const gColor  = t => G_COLOR[t]  || G_COLOR_OTRO;
const gNombre = t => G_NOMBRE[t] || t;

let gDatos = null, gAnim = null;

async function pintarGrafo(){
  const cont = $('#g3d');
  if (!cont) return;
  if (gAnim){ cancelAnimationFrame(gAnim); gAnim = null; }

  let d;
  try { d = DEMO ? null : await api({ action:'grafo_temas' }); }
  catch (e) { cont.innerHTML = `<div class="sinwebgl">${e.message}</div>`; return; }
  if (!d || !d.nodos || d.nodos.length < 2){
    cont.innerHTML = '<div class="sinwebgl">Todavía no hay suficientes preguntas para dibujar el mapa.<br>Hacen falta al menos dos temas con ' + MIN_N + ' personas cada uno.</div>';
    return;
  }
  gDatos = d;

  $('#gOcultas').textContent = d.ocultas
    ? `Ahora mismo hay ${d.ocultas} pareja${d.ocultas === 1 ? '' : 's'} de temas sin dibujar por no llegar a ese mínimo.`
    : 'Ahora mismo no hay ninguna pareja oculta.';

  $('#gLeyenda').innerHTML = d.nodos.map(n =>
    `<span><i style="background:${gColor(n.topic)}"></i>${gNombre(n.topic)}</span>`).join('');

  // Tabla equivalente, siempre disponible
  $('#gTablaBox').innerHTML = tabla(
    ['Tema', 'Tema', 'Personas con ambas dudas'],
    d.aristas.map(a => [gNombre(a.origen), gNombre(a.destino), fmt(a.personas)]));
  $('#gTabla').onclick = () => {
    const abierto = !$('#gTablaBox').hidden;
    $('#gTablaBox').hidden = abierto;
    $('#gTabla').textContent = abierto ? 'Ver los mismos datos en tabla' : 'Ocultar la tabla';
  };

  if (typeof THREE === 'undefined'){
    cont.innerHTML = `<div class="sinwebgl">No se pudo cargar la librería de 3D
      (¿sin internet o bloqueada por la red de la Facultad?).<br>
      Los mismos datos están completos en la tabla de abajo.</div>`;
    $('#gTablaBox').hidden = false;
    $('#gTabla').textContent = 'Ocultar la tabla';
    return;
  }
  montarGrafo3D(cont, d);
}

function montarGrafo3D(cont, d){
  cont.innerHTML = '<div class="pista">Arrastra para girar · rueda o pellizca para acercar · toca una esfera</div>';

  const nodos = d.nodos.map(n => ({ ...n, p:new THREE.Vector3(
    (Math.random()-.5)*60, (Math.random()-.5)*60, (Math.random()-.5)*60), v:new THREE.Vector3() }));
  const idx = Object.fromEntries(nodos.map((n,i) => [n.topic, i]));
  const aristas = d.aristas.filter(a => a.origen in idx && a.destino in idx);

  // ── Acomodo por fuerzas, en 3D. Se corre hasta el final ANTES de dibujar:
  // un grafo que sigue temblando mientras lo lees es ruido, no información.
  const maxA = Math.max(...aristas.map(a => a.personas), 1);
  for (let paso = 0; paso < 420; paso++){
    const frena = 0.92 - paso/420*0.35;
    for (let i = 0; i < nodos.length; i++){
      for (let j = i+1; j < nodos.length; j++){
        const dv = new THREE.Vector3().subVectors(nodos[i].p, nodos[j].p);
        const dist = Math.max(dv.length(), 4);
        const f = 5200 / (dist*dist);
        dv.normalize().multiplyScalar(f);
        nodos[i].v.add(dv); nodos[j].v.sub(dv);
      }
    }
    aristas.forEach(a => {
      const A = nodos[idx[a.origen]], B = nodos[idx[a.destino]];
      // Más gente compartiendo la duda = más corto el hilo = más cerca las esferas
      const reposo = 46 - 26 * (a.personas / maxA);
      const dv = new THREE.Vector3().subVectors(B.p, A.p);
      const f = (dv.length() - reposo) * 0.06;
      dv.normalize().multiplyScalar(f);
      A.v.add(dv); B.v.sub(dv);
    });
    nodos.forEach(n => {
      n.v.addScaledVector(n.p, -0.012);          // hacia el centro
      n.p.add(n.v.multiplyScalar(frena));
    });
  }
  const centro = nodos.reduce((a,n) => a.add(n.p), new THREE.Vector3()).divideScalar(nodos.length);
  nodos.forEach(n => n.p.sub(centro));

  // ── Escena ─────────────────────────────────────────────────────────
  const esc = new THREE.Scene();
  esc.background = new THREE.Color(0xffffff);
  const cam = new THREE.PerspectiveCamera(46, 1, 0.1, 2000);
  const rend = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  rend.setPixelRatio(Math.min(devicePixelRatio, 2));
  cont.appendChild(rend.domElement);

  // Luz suave, para que los colores se lean pastel y no plástico
  esc.add(new THREE.AmbientLight(0xffffff, 0.86));
  const l1 = new THREE.DirectionalLight(0xffffff, 0.55); l1.position.set(60,90,70); esc.add(l1);
  const l2 = new THREE.DirectionalLight(0xEDE5FF, 0.34); l2.position.set(-70,-40,-50); esc.add(l2);

  const maxN = Math.max(...nodos.map(n => n.personas));
  const esferas = [];
  const geoEsf = new THREE.SphereGeometry(1, 42, 30);
  nodos.forEach(n => {
    const r = 4.2 + 8.5 * Math.sqrt(n.personas / maxN);
    const mat = new THREE.MeshStandardMaterial({
      color:new THREE.Color(gColor(n.topic)), roughness:0.52, metalness:0.03,
      emissive:new THREE.Color(gColor(n.topic)), emissiveIntensity:0.14 });
    const m = new THREE.Mesh(geoEsf, mat);
    m.position.copy(n.p); m.scale.setScalar(r);
    m.userData = { nodo:n, r };
    esc.add(m); esferas.push(m);
  });

  // Hilos: cilindros, porque el grosor de una línea no es fiable entre navegadores
  const geoCil = new THREE.CylinderGeometry(1, 1, 1, 10, 1, true);
  const hilos = [];
  aristas.forEach(a => {
    const A = nodos[idx[a.origen]].p, B = nodos[idx[a.destino]].p;
    const g = 0.22 + 1.05 * (a.personas / maxA);
    const mat = new THREE.MeshBasicMaterial({
      color:new THREE.Color(0xB9AFD6), transparent:true,
      opacity:0.3 + 0.42 * (a.personas / maxA) });
    const m = new THREE.Mesh(geoCil, mat);
    const medio = new THREE.Vector3().addVectors(A,B).multiplyScalar(0.5);
    const dir = new THREE.Vector3().subVectors(B,A);
    m.position.copy(medio);
    m.scale.set(g, dir.length(), g);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    m.userData = { arista:a };
    esc.add(m); hilos.push(m);
  });

  // ── Etiquetas en HTML, proyectadas cada cuadro. Se leen mejor que un sprite
  // y el color deja de ser el único dato que distingue una esfera de otra.
  const etiquetas = nodos.map(n => {
    const e = document.createElement('div');
    e.className = 'eti'; e.textContent = gNombre(n.topic);
    cont.appendChild(e); return e;
  });

  // ── Cámara orbital propia: los mismos eventos para dedo y ratón ────
  let radio = 128, theta = 0.72, phi = 1.18, auto = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const punteros = new Map();
  let ultimo = null, distPellizco = 0, movido = 0;

  const colocaCam = () => {
    cam.position.set(radio*Math.sin(phi)*Math.cos(theta), radio*Math.cos(phi),
                     radio*Math.sin(phi)*Math.sin(theta));
    cam.lookAt(0,0,0);
  };

  cont.addEventListener('pointerdown', ev => {
    cont.setPointerCapture(ev.pointerId);
    punteros.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
    ultimo = { x:ev.clientX, y:ev.clientY }; movido = 0; auto = false;
    cont.classList.add('arrastrando');
  });
  cont.addEventListener('pointermove', ev => {
    if (!punteros.has(ev.pointerId)) return;
    punteros.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
    if (punteros.size === 2){
      const [a,b] = [...punteros.values()];
      const dd = Math.hypot(a.x-b.x, a.y-b.y);
      if (distPellizco) radio = Math.min(320, Math.max(52, radio * distPellizco/dd));
      distPellizco = dd; colocaCam(); return;
    }
    const dx = ev.clientX - ultimo.x, dy = ev.clientY - ultimo.y;
    movido += Math.abs(dx) + Math.abs(dy);
    theta -= dx * 0.006;
    phi = Math.min(Math.PI - 0.12, Math.max(0.12, phi - dy * 0.006));
    ultimo = { x:ev.clientX, y:ev.clientY };
    colocaCam();
  });
  const soltar = ev => {
    punteros.delete(ev.pointerId);
    if (punteros.size < 2) distPellizco = 0;
    cont.classList.remove('arrastrando');
    if (movido < 6) elegir(ev);      // fue un toque, no un arrastre
  };
  cont.addEventListener('pointerup', soltar);
  cont.addEventListener('pointercancel', soltar);
  cont.addEventListener('wheel', ev => {
    ev.preventDefault(); auto = false;
    radio = Math.min(320, Math.max(52, radio * (1 + Math.sign(ev.deltaY)*0.1)));
    colocaCam();
  }, { passive:false });

  // ── Selección ──────────────────────────────────────────────────────
  const rayo = new THREE.Raycaster();
  let elegido = null;
  function elegir(ev){
    const c = cont.getBoundingClientRect();
    rayo.setFromCamera(new THREE.Vector2(
      ((ev.clientX-c.left)/c.width)*2-1, -((ev.clientY-c.top)/c.height)*2+1), cam);
    const hit = rayo.intersectObjects(esferas)[0];
    marcar(hit ? hit.object : null);
  }
  function marcar(obj){
    elegido = obj;
    esferas.forEach(m => {
      const activo = !elegido || m === elegido;
      m.material.opacity = activo ? 1 : 0.24;
      m.material.transparent = !activo;
      m.material.emissiveIntensity = m === elegido ? 0.3 : 0.14;
    });
    if (!elegido){
      hilos.forEach(h => h.material.opacity = 0.3 + 0.42*(h.userData.arista.personas/maxA));
      $('#gFicha').innerHTML = `<p class="vacia">Toca una esfera para ver de qué trata,
        cuánta gente pregunta por eso y con qué otras dudas aparece junto.</p>`;
      return;
    }
    const t = elegido.userData.nodo.topic;
    hilos.forEach(h => {
      const a = h.userData.arista;
      const tocada = a.origen === t || a.destino === t;
      h.material.opacity = tocada ? 0.85 : 0.07;
    });
    ficha(elegido.userData.nodo);
  }

  function ficha(n){
    const conectadas = gDatos.aristas
      .filter(a => a.origen === n.topic || a.destino === n.topic)
      .map(a => ({ otro: a.origen === n.topic ? a.destino : a.origen, n: a.personas }))
      .sort((x,y) => y.n - x.n);
    const pct = x => Math.round(100 * x / n.personas);
    $('#gFicha').innerHTML = `
      <h4><i style="background:${gColor(n.topic)}"></i>${gNombre(n.topic)}</h4>
      <p style="font-size:12.5px;color:var(--text-muted);margin-bottom:12px">
        Preguntas hechas a PUM-AI sobre este tema.</p>
      <div class="kv"><span>Personas que preguntaron</span><b>${fmt(n.personas)}</b></div>
      <div class="kv"><span>Preguntas en total</span><b>${fmt(n.preguntas)}</b></div>
      <div class="kv"><span>Sin buena respuesta</span><b>${
        n.pct_sin_buena_respuesta == null ? '—' : pct2(n.pct_sin_buena_respuesta)}</b></div>
      ${conectadas.length ? `<div class="conq"><b>Con qué más lo preguntan</b><br>${
        conectadas.slice(0,4).map(c =>
          `${gNombre(c.otro)} — ${fmt(c.n)} personas <span style="color:var(--text-muted)">(${pct(c.n)}% de las de este tema)</span>`
        ).join('<br>')}</div>` : ''}`;
  }

  // ── Bucle ──────────────────────────────────────────────────────────
  function medir(){
    const w = cont.clientWidth, h = cont.clientHeight;
    rend.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(medir); ro.observe(cont); medir(); colocaCam();

  const v = new THREE.Vector3();
  (function cuadro(){
    gAnim = requestAnimationFrame(cuadro);
    if (!cont.isConnected){ cancelAnimationFrame(gAnim); gAnim = null; ro.disconnect(); return; }
    if (auto){ theta += 0.0016; colocaCam(); }
    rend.render(esc, cam);
    const c = cont.getBoundingClientRect();
    nodos.forEach((n,i) => {
      v.copy(n.p).project(cam);
      const vis = v.z < 1;
      etiquetas[i].style.opacity = vis ? (elegido && elegido.userData.nodo !== n ? 0.3 : 1) : 0;
      etiquetas[i].style.left = ((v.x*0.5+0.5)*c.width) + 'px';
      etiquetas[i].style.top  = ((-v.y*0.5+0.5)*c.height - esferas[i].userData.r*1.9) + 'px';
    });
  })();
}
const pct2 = n => (n === null || n === undefined) ? '—' : (+n).toFixed(1).replace('.0','') + '%';

const DISP = {
  disponible:        'Disponible',
  pocas_existencias: 'Quedan pocas',
  agotado:           'Agotado',
  con_receta:        'Sólo con receta',
  no_se_ofrece:      'No se ofrece aquí',
};
const N_FAMILIA = { larga_duracion:'Larga duración', hormonal:'Hormonal', barrera:'Barrera',
  emergencia:'Emergencia', definitivo:'Definitivo', conocimiento_fertilidad:'Conocer la fertilidad' };
const N_SERVICIO = { psicologia:'Psicología', odontologia:'Odontología',
  enfermeria:'Enfermería', ssr:'Salud sexual y reproductiva' };
const N_FRANJA = { lun:'Lun', mar:'Mar', mie:'Mié', jue:'Jue', vie:'Vie' };
const franjaTxt = f => (f||[]).map(x => {
  const [d,t] = String(x).split('_');
  return `${N_FRANJA[d] || d} ${t === 'am' ? 'a.m.' : 'p.m.'}`;
}).join(' · ') || 'Sin preferencia';
const fechaCorta = d => d ? new Date(d).toLocaleString('es-MX',
  { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

let CONTENIDO = { metodos:[], actividades:[] };

async function cargarContenido(){
  if (DEMO) return CONTENIDO;
  try { CONTENIDO = await api({ action:'contenido' }); } catch (e) { console.error(e); }
  return CONTENIDO;
}

// ── Catálogo de métodos ──────────────────────────────────────────

  const tb = document.querySelector('#tMetodos tbody');
  if (!tb) return;
  tb.innerHTML = '<tr><td colspan="5" style="color:var(--text-muted)">Cargando…</td></tr>';

  tb.innerHTML = l.map(m => `<tr data-slug="${m.slug}">
    <td><b>${m.nombre}</b><br><span style="font-size:12px;color:var(--text-muted)">
      ${m.eficacia_real != null ? `${(100 - m.eficacia_real).toFixed(1)} de cada 100 en uso real` : 'Sin cifra de eficacia'}</span></td>
    <td style="font-size:12.5px;color:var(--text-secondary)">${N_FAMILIA[m.familia] || m.familia}</td>

        font-size:13px;font-family:inherit;background:var(--surface-1);color:var(--text-primary)">
      ${Object.entries(DISP).map(([k,t]) =>
        `<option value="${k}"${k === m.disponibilidad ? ' selected' : ''}>${t}</option>`).join('')}
    </select></td>
    <td><input class="mNota" value="${(m.nota_disponibilidad || '').replace(/"/g,'&quot;')}"
        placeholder="Opcional: qué hacer mientras tanto"
        style="width:100%;padding:7px 10px;border-radius:9px;border:1px solid var(--line-2);
               font-size:13px;font-family:inherit;background:var(--surface-1);color:var(--text-primary)"></td>
    <td style="text-align:right;font-size:12px;color:var(--text-muted)">
      ${m.actualizado_por ? `${m.actualizado_por}<br>${fechaCorta(m.actualizado_en)}` : '—'}</td>
  </tr>`).join('');

  tb.querySelectorAll('tr').forEach(tr => {

    tr.querySelector('.mNota').onblur   = guardar;
  });
}

const localISO = d => { const x = new Date(d);
  return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,16); };

  const cont = $('#listaActs');
  if (!cont) return;
  cont.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Cargando…</p>';
  CONTENIDO.actividades = [];

  const l = CONTENIDO.actividades || [];
  cont.innerHTML = l.length ? l.map(a => `
    <div style="border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:11px;
                display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">

        </div>
      </div>
      <span style="padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:650;
        background:${a.publicada ? 'color-mix(in srgb,var(--good) 15%,transparent)' : 'var(--surface-2)'};
        color:${a.publicada ? 'var(--good)' : 'var(--text-muted)'}">
        ${a.publicada ? 'Publicada' : 'Borrador'}</span>
      <button class="btn btn-2 btn-sm" data-edit="${a.id}">Editar</button>
      <button class="btn btn-d btn-sm" data-del="${a.id}">Borrar</button>
    </div>`).join('')
    : '<p style="color:var(--text-muted);font-size:13px">Todavía no hay actividades programadas.</p>';

  cont.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const a = l.find(x => x.id === b.dataset.edit);
    $('#aId').value = a.id; $('#aTitulo').value = a.titulo;
    $('#aDesc').value = a.descripcion || ''; $('#aTipo').value = a.tipo;

  cont.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Borrar esta actividad? También se borran las inscripciones.')) return;
    try { await api({ action:'actividad_borrar', id:b.dataset.del }); await pintarActividades(); }
    catch (e) { alert(e.message); }
  });

  const limpiar = () => { ['#aId','#aTitulo','#aDesc','#aLugar','#aEnlace','#aCupo','#aIni','#aFin']
    .forEach(x => $(x).value = ''); $('#aPub').value = '0'; $('#aMsg').textContent = ''; };
  $('#aLimpiar').onclick = limpiar;
  $('#aGuardar').onclick = async () => {
    if (!$('#aTitulo').value.trim() || !$('#aIni').value){
      $('#aMsg').style.color = 'var(--critical)';
      $('#aMsg').textContent = 'Faltan el título y la fecha de inicio.'; return;
    }
    try {
      await api({ action:'actividad_upsert', actividad:{
        id: $('#aId').value || null, titulo:$('#aTitulo').value.trim(),
        descripcion:$('#aDesc').value.trim() || null, tipo:$('#aTipo').value,
        modalidad:$('#aModo').value, lugar:$('#aLugar').value.trim() || null,
        enlace:$('#aEnlace').value.trim() || null,
        inicia_en:new Date($('#aIni').value).toISOString(),
        termina_en:$('#aFin').value ? new Date($('#aFin').value).toISOString() : null,
        cupo:$('#aCupo').value ? +$('#aCupo').value : null,
        publicada:$('#aPub').value === '1' } });
      limpiar();
      $('#aMsg').style.color = 'var(--good)'; $('#aMsg').textContent = 'Guardada.';
      await pintarActividades();
    } catch (e) { $('#aMsg').style.color = 'var(--critical)'; $('#aMsg').textContent = e.message; }
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   COMUNIDAD ANÓNIMA

   Lo que AURA muestra en su pantalla de usuarios anónimos —código, facultad,
   carrera, métricas— aquí no se puede copiar tal cual, por dos razones que no
   son de estilo:

   · El anonymous_code es la CREDENCIAL de la alumna. Verlo en el panel
     convierte "soy CUS-ABC-1234" en una llave. Cada renglón trae en su lugar
     un seudónimo que se rehace en cada carga: sirve para leer la tabla y no
     sirve para armar un expediente a lo largo del tiempo.
   · Carrera + semestre identifica en una población de cientos. El perfil sólo
     guarda área y tramo de avance, y ésa fue una decisión de diseño, no una
     omisión.

   Y una tercera cosa que hace fn_comunidad y conviene entender: quitar el
   nombre no basta. Lo que identifica es la combinación. Antes de devolver, las
   filas se agrupan por (área, avance) y cualquier grupo con menos de 10 se
   generaliza; si aun así no llega, se suprime.
   ═══════════════════════════════════════════════════════════════════════════ */
let COMU = null;
let comuOrden = { col:'seudonimo', dir:1 };

const COL_COMU = [
  { k:'seudonimo',         t:'Seudónimo',   w:'86px' },
  { k:'area',              t:'Área' },
  { k:'avance',            t:'Avance' },
  { k:'antiguedad',        t:'Antigüedad' },
  { k:'actividad',         t:'Última entrada' },
  { k:'metodo',            t:'Método',      eti:true },
  { k:'estado_metodo',     t:'Adherencia' },
  { k:'permanencia',       t:'Permanencia' },
  { k:'motivo_fin',        t:'Motivo de baja', eti:true },
  { k:'consulta',          t:'Consulta' },
  { k:'seguimiento_3m',    t:'Seguimiento' },
  { k:'dolor',             t:'Dolor máx.' },
  { k:'falto_clase',       t:'Faltó a clase' },
  { k:'seguimiento_ciclo', t:'Ciclos' },
  { k:'tamizaje',          t:'Tamizaje' },
  { k:'temas_pum',         t:'PUM-AI' },
];

const celdaComu = (f, c) => {
  const v = f[c.k];
  if (v === null || v === undefined) return '<span style="color:var(--text-muted)">—</span>';
  if (v === true)  return 'sí';
  if (v === false) return 'no';
  if (String(v).startsWith('no publicad'))
    return `<span style="color:var(--text-muted)" title="Se ocultó para que el grupo alcance el umbral">${v}</span>`;
  return c.eti ? eti(v) : v;
};

async function pintarComunidad(){
  const box = $('#comuBody');
  if (!box) return;
  if (DEMO){ box.innerHTML = SIN_DATOS('Sin conexión configurada.'); return; }
  box.innerHTML = SIN_DATOS('Cargando la comunidad…');
  try {
    COMU = await api({ action:'comunidad', meses:FILTRO.meses, area:FILTRO.area,
                       estado:comuEstado, limite:2000 });
  } catch (err) { box.innerHTML = SIN_DATOS(err.message); return; }
  dibujarComunidad();
}

let comuEstado = null;
const ESTADOS = [
  { v:null,                             t:'Todas' },
  { v:'vigente',                        t:'Con método vigente' },
  { v:'lo dejo',                        t:'Lo dejaron' },
  { v:'nunca registro',                 t:'Sin método registrado' },
  { v:'suspendio por embarazo buscado', t:'Buscando embarazo' },
];

function dibujarComunidad(){
  const box = $('#comuBody');
  if (!COMU) { box.innerHTML = SIN_DATOS(); return; }
  if (COMU.ok === false){
    box.innerHTML = SIN_DATOS(`Con ese corte quedan ${fmt(COMU.publicadas||0)} personas publicables,
      menos que el umbral de ${MIN_N}. No se muestra ninguna fila.`);
    return;
  }
  const filas = [...(COMU.filas||[])].sort((a,b)=>{
    const A=a[comuOrden.col], B=b[comuOrden.col];
    if (A===B) return 0;
    if (A===null||A===undefined) return 1;
    if (B===null||B===undefined) return -1;
    return (A>B?1:-1)*comuOrden.dir;
  });

  const cuenta = k => filas.filter(f=>f.estado_metodo===k).length;
  const kpis = [
    ['En el corte',      fmt(COMU.total_cohorte), 'personas registradas'],
    ['Publicadas',       fmt(COMU.publicadas),
       COMU.suprimidas ? `${fmt(COMU.suprimidas)} suprimidas por umbral` : 'ninguna suprimida'],
    ['Generalizadas',    fmt(COMU.generalizadas), 'se les ocultó un dato para llegar al umbral'],
    ['Con método vigente', fmt(cuenta('vigente')), 'adherencia activa'],
    ['Lo dejaron',       fmt(cuenta('lo dejo')), 'con motivo registrado o no'],
  ];

  box.innerHTML = `
    <div class="grid g4">${kpis.map(([k,v,s])=>
      `<div class="card tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('')}</div>

    <div class="filters">
      <span class="lbl">Adherencia</span>
      <div class="seg">${ESTADOS.map(o=>
        `<button data-ce="${o.v ?? ''}" class="${comuEstado===o.v?'on':''}">${o.t}</button>`).join('')}</div>
      <button class="btn btn-2 btn-sm" id="comuCsv" style="margin-left:auto">↧ Exportar CSV</button>
    </div>

    <div class="card pad">
      <div class="chart-head"><div>
        <h3>Quiénes son, sin que sean nadie</h3>
        <p class="why">Ordena por cualquier columna. Un guion largo significa que ese dato no
          existe; "no publicado" significa que existía y se ocultó para proteger al grupo.</p>
      </div></div>
      <div class="tbl on" style="overflow:auto;max-height:620px">
        <table><thead><tr>${COL_COMU.map(c=>
          `<th data-sc="${c.k}" style="cursor:pointer;white-space:nowrap${c.w?`;width:${c.w}`:''}">
            ${c.t}${comuOrden.col===c.k?(comuOrden.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
          <tbody>${filas.map(f=>`<tr>${COL_COMU.map(c=>
            `<td style="white-space:nowrap">${celdaComu(f,c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div class="card pad">
      <h3>Cómo se protege esta tabla, y hasta dónde</h3>
      <p class="why">Vale la pena leerlo una vez: es lo que hay que poder explicar si alguien
        pregunta por qué el Centro publica renglones de personas.</p>
      <div style="font-size:13px;line-height:1.65;color:var(--text-secondary)">
        <p style="margin-bottom:10px"><b style="color:var(--text-primary)">La clase de equivalencia
          es (área, avance).</b> Son los dos únicos datos que alguien podría saber por fuera del
          sistema. Cuándo se registró o cuándo entró por última vez no lo sabe nadie más: eso es
          conducta, no identidad. Cada combinación de área y avance que ves aquí agrupa a
          ${MIN_N} personas o más.</p>
        <p style="margin-bottom:10px"><b style="color:var(--text-primary)">Además hay
          l-diversidad.</b> Si dentro de un grupo todas comparten el mismo método, saber a qué
          grupo pertenece alguien basta para conocer su método aunque el grupo sea grande. En ese
          caso el valor se oculta.</p>
        <p style="margin-bottom:10px"><b style="color:var(--warn)">Y esto es lo que NO protege.</b>
          Si alguien ya conoce varias respuestas de salud de una persona y viene a buscar el
          renglón que las reúne, esta tabla no lo detiene. Contra eso ninguna tabla de microdatos
          sirve; para eso están los agregados. Si el uso que vas a darle es de ese tipo, usa el
          Tablero, no esta pantalla.</p>
      </div>
      <div style="margin-top:14px">
        ${tabla(['Área','Avance','Personas'],
          (COMU.clases||[]).map(c=>[c.area, c.avance, fmt(c.n)]))}
      </div>
    </div>`;

  $$('#comuBody th[data-sc]').forEach(th => th.onclick = () => {
    const k = th.dataset.sc;
    comuOrden = comuOrden.col === k ? { col:k, dir:-comuOrden.dir } : { col:k, dir:1 };
    dibujarComunidad();
  });
  $$('#comuBody button[data-ce]').forEach(b => b.onclick = () => {
    comuEstado = b.dataset.ce === '' ? null : b.dataset.ce;
    pintarComunidad();
  });
  const csv = $('#comuCsv');
  if (csv) csv.onclick = () => {
    const cols = COL_COMU.map(c=>c.k);
    const esc = v => { const s = v===null||v===undefined?'':String(v);
      return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
    const txt = [cols.join(','), ...filas.map(f=>cols.map(c=>esc(f[c])).join(','))].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' }));
    a.download = `comunidad-anonima-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };
}


/* ═══════════════════════════════════════════════════════════════════════════
   LABORATORIO

   Tres herramientas, y la primera cosa que hay que tener clara es cuál de las
   tres es simulación:

     Ensayo de mensaje     SÍ. Población sintética + reglas explícitas.
     Simulación de 72 h    SÍ. La misma población, con reloj.
     Ensayo de consejería  NO. Un personaje ficticio escrito a mano. No predice
                           nada y no es evidencia sobre nadie.

   La regla que ordena las dos simulaciones: NUNCA leen un renglón. Leen
   cusmsr.fn_calibracion_sim(), que sólo publica celdas que ya pasaron el
   umbral, y con esas celdas se arma una población muestreando cada atributo
   POR SEPARADO. Eso destruye las correlaciones a propósito: si se muestreara
   de la distribución conjunta, cada agente sería la copia de una combinación
   que existe de verdad, y una combinación rara identifica aunque no traiga
   nombre. Se pierde realismo para que ningún agente corresponda a nadie.

   Segunda regla, y es la que hace útil la herramienta: cada número que entra
   a la simulación trae etiqueta de DATO o de SUPUESTO. Los supuestos son
   editables y se guardan con la corrida. Una simulación que no dice cuáles de
   sus números se inventó no sirve para discutir nada.
   ═══════════════════════════════════════════════════════════════════════════ */

const cintaSim = (esSim, titulo, texto) => `
  <div class="note ${esSim?'info':'lock'}" style="align-items:flex-start">
    <span class="ic">${esSim?'◈':'☏'}</span>
    <div><b>${titulo} · <span style="color:${esSim?'var(--lila-700)':'var(--text-primary)'}">
      ${esSim?'ESTO ES UNA SIMULACIÓN':'ESTO NO ES UNA SIMULACIÓN'}</span></b>
      ${texto}</div></div>`;

const SIN_AGREGADOS = que => `<div class="deny"><div class="big">⛨</div>
  <b style="color:var(--text-primary)">Tu rol no puede usar ${que}.</b>
  <p style="margin-top:8px">Esta herramienta consume cifras agregadas, así que requiere además
  el permiso <code>ver_agregados</code>. El ensayo de consejería sí está disponible para ti:
  no toca ningún dato.</p></div>`;

// Canales de difusión. El alcance es SUPUESTO — la base no mide por dónde se
// enteró nadie, y no debería: eso sería rastreo.
const LAB_CANALES = {
  whatsapp: { t:'WhatsApp y grupos',    on:true,  alcance:38 },
  correo:   { t:'Correo institucional', on:true,  alcance:22 },
  redes:    { t:'Redes del Centro',     on:false, alcance:26 },
  cartel:   { t:'Carteles en campus',   on:false, alcance:18 },
  clase:    { t:'Aviso en clase',       on:false, alcance:55 },
};

// Coeficientes del modelo. TODOS son supuestos declarados; ninguno sale de la
// base. Están aquí, con nombre y valor a la vista, para que se puedan discutir.
const LAB_COEF = {
  comunidad:        11000, // personas a las que puede llegar una convocatoria
  atencion:          0.42, // de quien la ve, la lee
  interes_ajeno:     0.22, // responde aunque el tema no sea suyo
  barrera_base:      0.40, // lo que frena, antes de que el texto ayude
  alivio_gratis:     0.10, // decir que es gratuito
  alivio_confid:     0.13, // decir que es confidencial
  alivio_logistica:  0.11, // decir cuándo, dónde y cómo entrar
  comparte:          0.07, // de quien se inscribe, cuántas lo pasan
  tau:                 16, // horas de vida media de la difusión
  pide_consulta:     0.06, // de quien queda con intención, cuántas piden cita
  ajuste:             1.0, // corrección contra lo que de verdad pasó (ver contraste)
};

const LAB_ETIQ = {
  comunidad:'Tamaño de la comunidad alcanzable',
  atencion:'De quien lo ve, cuánta gente lo lee',
  interes_ajeno:'Responde aunque el tema no sea suyo',
  barrera_base:'Freno inicial (pena, horario, desconfianza)',
  alivio_gratis:'Cuánto ayuda decir que es gratuito',
  alivio_confid:'Cuánto ayuda decir que es confidencial',
  alivio_logistica:'Cuánto ayuda decir cuándo, dónde y cómo',
  comparte:'De quien se inscribe, cuánta gente lo comparte',
  tau:'Vida media de la difusión, en horas',
  pide_consulta:'De quien queda con intención, cuánta pide cita',
  ajuste:'Corrección contra la asistencia real (1 = sin corregir)',
};

const LAB = { calib:null, coef:{ ...LAB_COEF }, canales:{}, ficha:null, ultimo:null };
Object.keys(LAB_CANALES).forEach(k => LAB.canales[k] = LAB_CANALES[k].on);

// Generador con semilla: misma semilla y mismos supuestos, mismo resultado.
// Sin esto una simulación no se puede citar ni auditar.
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const escoge = (pesos, r) => {
  let u = r(), acc = 0;
  for (const p of pesos){ acc += p.p; if (u <= acc) return p.k; }
  return pesos[pesos.length-1].k;
};
const pesosDe = bloque => {
  const c = (bloque && bloque.celdas) || [];
  const tot = c.reduce((s,x)=>s+(+x.n),0) || 1;
  return c.map(x=>({ k:x.k, p:(+x.n)/tot }));
};

const nrm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

// Lectura determinista del texto. Esto NO usa PUM-AI: son reglas, corren en el
// navegador y dan el mismo resultado siempre. PUM-AI sirve para la reescritura
// y para ver lo que las reglas no ven.
function leerMensaje(txt){
  const t = nrm(txt);
  const palabras = (t.match(/[a-z0-9ñ]+/g) || []);
  const frases = (txt.match(/[.!?…]+/g) || []).length || 1;
  // Fernández-Huerta, el índice de legibilidad estándar para español.
  const silabas = palabras.reduce((s,w)=> s + Math.max(1,(w.match(/[aeiouáéíóúü]+/g)||[]).length), 0);
  const P = palabras.length ? 100 * silabas / palabras.length : 0;
  const F = palabras.length ? 100 * frases  / palabras.length : 0;
  const fh = Math.max(0, Math.min(100, 206.84 - 0.60 * P - 1.02 * F));
  return {
    palabras: palabras.length,
    legibilidad: Math.round(fh),
    nivel: fh >= 70 ? 'sencillo' : fh >= 50 ? 'medio' : 'difícil',
    temas: ['anticoncepcion','menstrual','its','embarazo','sexualidad','servicios']
      .filter(k => ({
        anticoncepcion:/anticoncep|pastilla|inyecc|implante|diu|parche|anillo|condon|preservativo/,
        menstrual:/menstrua|regla|periodo|ciclo|colico|dismenorrea|sangrad/,
        its:/vih|sida|its|ets|sifilis|clamidia|gonorrea|vph|papiloma|prueba|tamizaje/,
        embarazo:/embaraz|aborto|interrupcion|gestacion/,
        sexualidad:/sexual|sexo|placer|orientacion|pareja|consentimiento/,
        servicios:/cita|agenda|horario|consulta|servicio|centro|cusmsr|taller|platica/,
      })[k].test(t)),
    cuando:  /\d{1,2}[:h]\d{2}|\d{1,2}\s?(am|pm|hrs|horas)|lunes|martes|miercoles|jueves|viernes|sabado|\b\d{1,2}\s+de\s+(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)/.test(t),
    donde:   /aula|salon|edificio|auditorio|explanada|modulo|consultorio|zoom|meet|teams|https?:|liga|enlace/.test(t),
    como:    /inscri|registr|apunta|reserva|cupo|escanea|codigo qr|formulario|liga|enlace|llega y ya|sin cita/.test(t),
    gratis:  /gratis|gratuit|sin costo|no cuesta|no tiene costo/.test(t),
    confid:  /confidencial|anonim|privad|no se comparte|no le decimos/.test(t),
  };
}

// La probabilidad de que alguien acabe con intención de ir, dadas las
// propiedades del texto. Cada término es un coeficiente declarado arriba.
function barreraDe(lec, c){
  let b = c.barrera_base;
  if (lec.gratis) b -= c.alivio_gratis;
  if (lec.confid) b -= c.alivio_confid;
  if (lec.cuando && lec.donde && lec.como) b -= c.alivio_logistica;
  return Math.max(0.02, Math.min(0.95, b));
}
const factorLargo = n => n < 25 ? 0.80 : n <= 120 ? 1 : n <= 220 ? 0.82 : 0.62;
const factorNivel = l => l >= 70 ? 1 : l >= 50 ? 0.85 : 0.66;

const N_AGENTES = 4000;

// Construye la población sintética. Cada atributo se muestrea POR SEPARADO de
// su marginal: ésa es la razón de que ningún agente corresponda a una persona.
function poblacion(semilla){
  const r = mulberry32(semilla);
  const cal = LAB.calib;
  const pArea = pesosDe(cal?.poblacion?.area);
  const pAvan = pesosDe(cal?.poblacion?.avance);
  const interes = {};
  (cal?.interes || []).forEach(x => interes[x.tema] = (+x.pct) / 100);
  const g = [];
  for (let i = 0; i < N_AGENTES; i++){
    const a = {};
    a.area   = pArea.length ? escoge(pArea, r) : 'sin dato';
    a.avance = pAvan.length ? escoge(pAvan, r) : 'sin dato';
    a.interes = {};
    Object.keys(interes).forEach(t => a.interes[t] = r() < interes[t]);
    a.u = [r(), r(), r(), r(), r(), r()];   // sorteos fijos por agente
    g.push(a);
  }
  return g;
}

function correrMensaje(lec, canales, coef, semilla){
  const pob = poblacion(semilla);
  const escala = coef.comunidad / N_AGENTES;
  const pVer = 1 - canales.reduce((p,c)=> p * (1 - LAB_CANALES[c].alcance/100), 1);
  const pLeer = coef.atencion * factorLargo(lec.palabras);
  const pEnt  = factorNivel(lec.legibilidad);
  const barrera = barreraDe(lec, coef);

  const seg = {};
  let vio=0, leyo=0, entendio=0, intencion=0;
  pob.forEach(a => {
    const s = seg[a.area] = seg[a.area] || { n:0, i:0 };
    s.n++;
    const v = a.u[0] < pVer;                         if (!v) return; vio++;
    const l = a.u[1] < pLeer;                        if (!l) return; leyo++;
    const e = a.u[2] < pEnt;                         if (!e) return; entendio++;
    const suyo = lec.temas.some(t => a.interes[t]);
    const p = (suyo ? 1 : coef.interes_ajeno) * (1 - barrera);
    if (a.u[3] < p){ intencion++; s.i++; a.va = true; }
  });
  const aj = coef.ajuste > 0 ? coef.ajuste : 1;

  return {
    pVer, pLeer, pEnt, barrera, escala, semilla,
    embudo: [
      { k:'Comunidad alcanzable', v:Math.round(coef.comunidad) },
      { k:'Lo vieron',            v:Math.round(vio * escala) },
      { k:'Lo leyeron',           v:Math.round(leyo * escala) },
      { k:'Lo entendieron',       v:Math.round(entendio * escala) },
      { k:'Con intención de ir',  v:Math.round(intencion * escala * aj) },
    ],
    intencion: Math.round(intencion * escala * aj),
    crudo: Math.round(intencion * escala),
    segmentos: Object.entries(seg).map(([k,s])=>({
      k, n:Math.round(s.n*escala), i:Math.round(s.i*escala*aj),
      pct: s.n ? +(100*s.i*aj/s.n).toFixed(1) : 0,
    })).sort((a,b)=>b.pct-a.pct),
    pob,
  };
}

// Qué pasaría si el texto dijera lo que no dice. Es análisis de sensibilidad
// del modelo, no una predicción: se corre con la misma semilla para que la
// diferencia venga del cambio y no del azar.
function contrafactuales(lec, canales, coef, semilla, base){
  const pruebas = [
    { k:'gujeno', et:'decir que es gratuito',            campo:'gratis' },
    { k:'confid', et:'decir que es confidencial',        campo:'confid' },
    { k:'logis',  et:'poner hora, lugar y cómo entrar',  campo:'logistica' },
    { k:'facil',  et:'escribirlo más sencillo',          campo:'nivel' },
  ];
  return pruebas.map(p => {
    const l = { ...lec };
    if (p.campo === 'gratis'){ if (l.gratis) return null; l.gratis = true; }
    if (p.campo === 'confid'){ if (l.confid) return null; l.confid = true; }
    if (p.campo === 'logistica'){
      if (l.cuando && l.donde && l.como) return null;
      l.cuando = l.donde = l.como = true;
    }
    if (p.campo === 'nivel'){ if (l.legibilidad >= 70) return null; l.legibilidad = 72; }
    const r = correrMensaje(l, canales, coef, semilla);
    return { et:p.et, delta:r.intencion - base.intencion, total:r.intencion };
  }).filter(Boolean).filter(x => x.delta !== 0).sort((a,b)=>b.delta-a.delta);
}

// ── Las 72 horas ────────────────────────────────────────────────────────────
// Reloj hora por hora desde que se publica. La exposición llega repartida con
// una exponencial truncada a 72 h; nadie lee entre las 0 y las 6, así que esas
// horas se recorren a la mañana siguiente. Quien queda con intención se
// inscribe con un rezago propio.
function correr72(lec, canales, coef, semilla, cupo, horaPub){
  const base = correrMensaje(lec, canales, coef, semilla);
  const r = mulberry32(semilla ^ 0x9E3779B9);
  const tau = Math.max(2, coef.tau);
  const Z = 1 - Math.exp(-72 / tau);
  const horas = Array.from({length:72}, (_,h)=>({ h, exp:0, insc:0 }));
  const rezago = () => { const u = r(); return u < 0.5 ? Math.floor(r()*3)
    : u < 0.8 ? 3 + Math.floor(r()*6) : u < 0.95 ? 9 + Math.floor(r()*15) : 24 + Math.floor(r()*48); };

  const vistos = base.pob.filter(a => a.u[0] < base.pVer);
  vistos.forEach(a => {
    let t = Math.round(-tau * Math.log(1 - a.u[4] * Z));
    // Nadie abre un aviso a las tres de la mañana.
    for (let g = 0; g < 3; g++){
      const hd = (horaPub + t) % 24;
      if (hd >= 0 && hd < 7) t += (7 - hd); else break;
    }
    if (t > 71) return;
    horas[t].exp++;
    if (a.va){
      const ti = t + rezago();
      if (ti <= 71) horas[ti].insc++;
    }
  });

  // Reenvío: quien se inscribe lo pasa. Es una segunda ola pequeña y se
  // declara como supuesto, no se mide.
  let acumExp = 0, acumIns = 0, lleno = null;
  const escala = base.escala;
  const curva = horas.map(x => {
    const extra = Math.round(acumIns * coef.comparte * 0.06);
    acumExp += (x.exp + extra) * escala;
    acumIns += x.insc * escala * (1 + coef.comparte * 0.5);
    const cap = cupo ? Math.min(acumIns, cupo) : acumIns;
    if (cupo && lleno === null && acumIns >= cupo) lleno = x.h;
    return { h:x.h, exp:Math.round(acumExp), ins:Math.round(acumIns), cap:Math.round(cap) };
  });

  const alcanzadas = h => curva[Math.min(71, h)].exp;
  return {
    base, curva, lleno, cupo,
    total: curva[71].ins,
    ventana: { h24:alcanzadas(23), h48:alcanzadas(47), h72:alcanzadas(71) },
    consultas: Math.round(base.intencion * coef.pide_consulta),
  };
}

// Curva acumulada de 72 horas. Dos series, una línea de cupo, marcas de día.
function curva72(datos, cupo){
  if (!datos || !datos.length) return SIN_DATOS();
  const W=760,H=260,L=52,B=40,T=16,R=16;
  const max = Math.max(cupo||0, ...datos.map(d=>d.ins), 1);
  const paso = Math.pow(10, Math.floor(Math.log10(max)));
  const tope = Math.ceil(max/paso)*paso;
  const x = h => L+(W-L-R)*(h/71);
  const y = v => T+(H-T-B)*(1-v/tope);
  const ticks = [0, tope/4, tope/2, tope*3/4, tope];
  const linea = (k,c) => `<polyline fill="none" stroke="${c}" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"
    points="${datos.map(d=>`${x(d.h)},${y(d[k])}`).join(' ')}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">
    ${ticks.map(t=>`<g><line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"
       stroke="var(--grid)" stroke-width="1"/>
      <text x="${L-9}" y="${y(t)+4}" text-anchor="end" font-size="11"
       fill="var(--text-muted)">${fmt(Math.round(t))}</text></g>`).join('')}
    ${[0,24,48,71].map(h=>`<text x="${x(h)}" y="${H-B+21}" text-anchor="middle" font-size="11.5"
       fill="var(--text-secondary)">${h===0?'publica':h+' h'}</text>`).join('')}
    ${cupo?`<line x1="${L}" x2="${W-R}" y1="${y(cupo)}" y2="${y(cupo)}" stroke="var(--warn)"
       stroke-width="2" stroke-dasharray="6 5"/>
     <text x="${W-R}" y="${y(cupo)-7}" text-anchor="end" font-size="11.5"
       fill="var(--warn)">cupo ${fmt(cupo)}</text>`:''}
    ${linea('ins','var(--series-1)')}
    ${linea('cap','var(--series-4)')}
  </svg>`;
}

// ── Ficha de supuestos ──────────────────────────────────────────────────────
// Lo más importante de la pantalla: qué número salió de la base y qué número
// nos inventamos. Editable, y se guarda con la corrida.
function fichaSupuestos(){
  const cal = LAB.calib;
  const dato = (t, v, nota) => `<tr><td>${t}</td><td class="num">${v}</td>
    <td><span class="tag ok">dato</span></td><td style="font-size:11.5px;color:var(--text-muted)">${nota||''}</td></tr>`;
  const sup = (k) => `<tr><td>${LAB_ETIQ[k]}</td>
    <td class="num"><input data-coef="${k}" type="number" step="0.01" value="${LAB.coef[k]}"
      style="width:90px;text-align:right"></td>
    <td><span class="tag warn">supuesto</span></td>
    <td style="font-size:11.5px;color:var(--text-muted)">lo pusimos nosotros</td></tr>`;

  const ant = cal?.convocatoria?.anticipacion;
  const antOk = ant && (ant.celdas||[]).length > 1;
  const rez = cal?.convocatoria?.rezago;
  const rezOk = rez && (rez.celdas||[]).length > 1;

  return `<div class="card pad" style="margin-top:18px">
    <div class="chart-head"><div>
      <h3>De dónde sale cada número</h3>
      <p class="why">Una simulación que no distingue lo medido de lo supuesto no sirve para
        discutir nada. Cambia los supuestos y vuelve a correr: es para eso.</p>
    </div><div class="tools"><button class="btn btn-2 btn-sm" id="labReset">Volver a los valores por omisión</button></div></div>
    <div class="tbl on"><table>
      <thead><tr><th>Parámetro</th><th class="num">Valor</th><th>Origen</th><th>Nota</th></tr></thead>
      <tbody>
        ${dato('Personas registradas', fmt(cal?.poblacion?.registradas ?? 0), 'cusmsr.profiles')}
        ${dato('Mezcla por área', (cal?.poblacion?.area?.celdas||[]).length + ' categorías',
               (cal?.poblacion?.area?.suprimidas ? cal.poblacion.area.suprimidas + ' suprimidas por umbral' : 'ninguna suprimida'))}
        ${dato('Mezcla por avance', (cal?.poblacion?.avance?.celdas||[]).length + ' categorías', '')}
        ${(cal?.interes||[]).map(x=>dato('Interés en ' + eti(x.tema), x.pct + '%',
            x.personas + ' personas preguntaron de eso')).join('')}
        ${dato('Inscripciones históricas', fmt(cal?.convocatoria?.inscripciones ?? 0),
               (cal?.convocatoria?.actividades_publicadas ?? 0) + ' actividades publicadas')}
        ${antOk
          ? dato('Anticipación al evento', (ant.celdas||[]).length + ' tramos',
                 'cuántos días antes se inscribe la gente; medido sobre inscripciones reales')
          : `<tr><td>Anticipación al evento</td><td class="num">—</td>
             <td><span class="tag warn">sin medición</span></td>
             <td style="font-size:11.5px;color:var(--text-muted)">Todavía no hay inscripciones
               suficientes repartidas en el tiempo.</td></tr>`}
        ${rezOk
          ? dato('Rezago entre publicar e inscribirse', (rez.celdas||[]).length + ' tramos', 'medido')
          : `<tr><td>Rezago entre publicar e inscribirse</td><td class="num">—</td>
             <td><span class="tag warn">sin medición</span></td>
             <td style="font-size:11.5px;color:var(--text-muted)">La tabla de actividades no guarda
               el instante de publicación, así que todas las inscripciones caen en la misma cubeta y
               la medición no sirve. La curva de las 72 horas usa un supuesto. Para medirlo de
               verdad haría falta una columna <code>publicada_en</code>: es el pendiente más barato
               con mayor efecto sobre esta herramienta.</td></tr>`}
        ${Object.keys(LAB_ETIQ).map(sup).join('')}
      </tbody></table></div>
  </div>`;
}

async function prepararLab(){
  if (DEMO || !puede('ver_agregados')) return;
  if (LAB.calib) { pintarSupuestos(); return; }
  try {
    const r = await api({ action:'lab_calibracion' });
    LAB.calib = r.calibracion;
  } catch (err) { /* la vista lo dirá */ }
  pintarSupuestos();
}
function pintarSupuestos(){
  const caja = $('#lmSupuestos') || $('#l7Detalle');
  if (!caja) return;
  if ($('#lmSupuestos')) $('#lmSupuestos').innerHTML = fichaSupuestos();
  conectarLab();
}

function pintarSalidaMensaje(lec, res, cf){

  if (!lec.donde)  falta.push('el lugar o la liga');

  if (!lec.gratis) falta.push('que es gratuito');
  if (!lec.confid) falta.push('que es confidencial');

  box.innerHTML = `
    <div class="chart-head"><div><h3>Resultado del ensayo</h3>
      <p class="why">Semilla ${res.semilla}. Con los mismos supuestos, el resultado se repite.</p></div></div>
    ${embudo(res.embudo)}
    <div style="margin-top:16px">${tabla(['Paso','Personas'], res.embudo.map(d=>[d.k, fmt(d.v)]))}</div>

    <h3 style="margin-top:22px">Lo que el texto sí dice y lo que no</h3>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px">
      ${[['cuándo',lec.cuando],['dónde',lec.donde],['cómo entrar',lec.como],
         ['gratuito',lec.gratis],['confidencial',lec.confid]].map(([t,v])=>
        `<span class="tag ${v?'ok':'warn'}">${v?'✓':'✕'} ${t}</span>`).join('')}

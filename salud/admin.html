    </div>
    ${falta.length ? `<p style="font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-top:8px">
      Falta ${falta.join(', ').replace(/, ([^,]*)$/, ' y $1')}.</p>` : ''}

    ${cf.length ? `<h3 style="margin-top:22px">Qué movería más la aguja</h3>
      <p class="why" style="margin-bottom:10px">Sensibilidad del modelo, no una promesa: es cuánto
        cambia el resultado si corriges eso y nada más, con la misma semilla.</p>
      ${tabla(['Si el texto…','Con intención','Diferencia'],
        cf.map(x=>[x.et, fmt(x.total), `+${fmt(x.delta)}`]))}` : ''}

    <h3 style="margin-top:22px">A quién llega y a quién no</h3>
    <p class="why" style="margin-bottom:10px">Si los porcentajes salen casi iguales entre áreas es
      porque no declaraste ninguna diferencia de alcance por canal — y eso también es un hallazgo:
      quiere decir que el modelo no tiene ninguna razón para creer que llegas distinto.</p>
    ${tabla(['Área','En la comunidad','Con intención','Tasa'],
      res.segmentos.map(s=>[s.k, fmt(s.n), fmt(s.i), s.pct + '%']))}

    ${contraste(res.intencion)}
    ${LAB.ficha ? fichaPumai(LAB.ficha) : ''}`;

  const aj = $('#labAjustar');
  if (aj) aj.onclick = () => {
    const med = +(LAB.calib?.convocatoria?.mediana_por_actividad || 0);
    if (!med || !res.crudo) return;
    LAB.coef.ajuste = +(med / res.crudo).toFixed(4);
    pintarSupuestos();
    const b = $('#lmCorrer'); if (b) b.click();
  };
}

// Contraste con lo que de verdad pasó. Es la parte que impide que la
// simulación se vuelva un generador de cifras bonitas: si el modelo dice diez
// veces más de lo que jamás se ha logrado, el modelo está mal, no la realidad.
function contraste(intencion){
  const cal = LAB.calib;
  const med = +(cal?.convocatoria?.mediana_por_actividad ?? 0);
  const acts = cal?.convocatoria?.actividades_publicadas ?? 0;
  if (!med || !acts || !intencion) return '';
  const razon = intencion / med;
  const grave = razon > 3 || razon < 0.33;
  return `
    <h3 style="margin-top:24px">Contraste con lo que ya pasó</h3>
    <div class="note ${grave ? 'warn' : 'ok'}"><span class="ic">${grave ? '⚠' : '✓'}</span>
      <div><b>${grave ? 'El modelo y la realidad no se parecen' : 'El modelo está en el orden correcto'}</b>
        Esta corrida da <b style="display:inline">${fmt(intencion)}</b> personas con intención.
        Tus ${acts} actividades publicadas tuvieron una mediana de
        <b style="display:inline">${fmt(Math.round(med))}</b> inscripciones.
        Son <b style="display:inline">${razon >= 1 ? razon.toFixed(1) + ' veces más' : (1/razon).toFixed(1) + ' veces menos'}</b>.
        ${grave ? 'Una de dos: o los supuestos de alcance por canal están muy por encima de lo que ' +
                  'realmente pasa, o esas actividades se difundieron muchísimo menos de lo que estás ' +
                  'simulando. Antes de usar este número para decidir algo, arregla eso.'
                : 'No quiere decir que la cifra sea correcta, sólo que no es absurda.'}
      </div></div>
    <button class="btn btn-2 btn-sm" id="labAjustar">Ajustar los supuestos a lo que ya pasó</button>
    <p style="font-size:11.5px;color:var(--text-muted);margin-top:8px;line-height:1.55">
      Esto no arregla el modelo: mete un factor de corrección (${LAB.coef.ajuste}) para que el
      resultado coincida con tu mediana histórica. Sirve para acercarse; lo que sirve de verdad es
      corregir los supuestos de alcance uno por uno.</p>`;
}

  const burbuja = (t, mia) => `<div style="align-self:${mia?'flex-end':'flex-start'};max-width:82%;
    background:${mia?'var(--lila-100, var(--surface-2))':'var(--surface-2)'};

}

async function lcEnviarTurno(txt){
  if (lcOcupado) return;
  if (txt){ lcTurnos.push({ rol:'user', texto:txt }); }
  lcOcupado = true; pintarChat();
  try {
    const r = await api({ action:'lab_ai', modo:'consejeria',
                          caso: CASOS[lcCaso].d, turnos: lcTurnos });
    lcTurnos.push({ rol:'model', texto:r.texto });
  } catch (err) {
    lcTurnos.push({ rol:'model', texto:'[No pude responder: ' + err.message + ']' });
  } finally { lcOcupado = false; pintarChat(); }
}

// ── Cableado de los tres tableros del Laboratorio ───────────────────────────
function conectarLab(){
  const marcaCanal = (cont) => $$(cont + ' button[data-canal]').forEach(b => b.onclick = () => {
    const k = b.dataset.canal;
    LAB.canales[k] = !LAB.canales[k];
    b.classList.toggle('on', LAB.canales[k]);
  });
  marcaCanal('#lmCanales'); marcaCanal('#l7Canales');

  $$('input[data-coef]').forEach(i => i.onchange = () => {
    const v = parseFloat(i.value);
    if (!isNaN(v)) LAB.coef[i.dataset.coef] = v;
  });
  const reset = $('#labReset');
  if (reset) reset.onclick = () => { LAB.coef = { ...LAB_COEF }; pintarSupuestos(); };

  // ── Ensayo de mensaje
  const correrLm = async (conAI) => {
    const txt = ($('#lmTexto')?.value || '').trim();
    if (!txt) { alert('Escribe la convocatoria primero.'); return; }
    if (!LAB.calib){ alert('No pude traer la calibración de la base. Vuelve a entrar a la sección.'); return; }
    const canales = canalesActivos();
    if (!canales.length){ alert('Elige al menos un canal de difusión.'); return; }
    const lec = leerMensaje(txt);
    const semilla = 20260818;
    const res = correrMensaje(lec, canales, LAB.coef, semilla);
    const cf  = contrafactuales(lec, canales, LAB.coef, semilla, res);
    LAB.ultimo = { lec, res, cf, canales, texto:txt, semilla };
    if (conAI){
      $('#lmSalida').innerHTML = SIN_DATOS('PUM-AI está leyendo la convocatoria…');
      try { LAB.ficha = (await api({ action:'lab_ai', modo:'mensaje', texto:txt })).ficha; }
      catch (err) { LAB.ficha = null; alert(err.message); }
    }
    pintarSalidaMensaje(lec, res, cf);
    const usar = $('#lmUsar');
    if (usar) usar.onclick = () => { $('#lmTexto').value = LAB.ficha.reescritura; };
  };
  const bC = $('#lmCorrer'); if (bC) bC.onclick = () => correrLm(false);
  const bL = $('#lmLeer');   if (bL) bL.onclick = () => correrLm(true);
  const bG = $('#lmGuardar');
  if (bG) bG.onclick = async () => {
    if (!LAB.ultimo){ alert('Corre el ensayo antes de guardarlo.'); return; }
    try {
      await api({ action:'lab_guardar', herramienta:'mensaje',
        titulo: $('#lmTitulo')?.value || null, semilla: LAB.ultimo.semilla,
        entrada:{ texto:LAB.ultimo.texto, canales:LAB.ultimo.canales,
                  supuestos:LAB.coef, lectura:LAB.ultimo.lec },
        salida:{ embudo:LAB.ultimo.res.embudo, segmentos:LAB.ultimo.res.segmentos,
                 contrafactuales:LAB.ultimo.cf } });
      bG.textContent = 'Guardado ✓';
      setTimeout(()=>bG.textContent = 'Guardar el ensayo', 2200);
    } catch (err) { alert(err.message); }
  };

  // ── Simulación de 72 horas
  const b7 = $('#l7Correr');
  if (b7) b7.onclick = () => {
    const txt = ($('#l7Texto')?.value || '').trim();
    if (!txt){ alert('Pega la convocatoria.'); return; }
    if (!LAB.calib){ alert('No pude traer la calibración de la base.'); return; }
    const canales = canalesActivos();
    if (!canales.length){ alert('Elige al menos un canal.'); return; }
    const cupo = Math.max(1, +($('#l7Cupo')?.value || 40));
    const hora = Math.min(23, Math.max(0, +($('#l7Hora')?.value || 10)));
    const urgente = ($('#l7Urg')?.value || 'no') === 'si';
    const lec = leerMensaje(txt);
    const res = correr72(lec, canales, LAB.coef, 20260818, cupo, hora);
    LAB.ultimo72 = { res, lec, canales, cupo, hora, urgente, texto:txt };
    pintarSalida72(res, urgente);
    $('#l7Detalle').innerHTML = fichaSupuestos();
    conectarLab();
  };
  const b7g = $('#l7Guardar');
  if (b7g) b7g.onclick = async () => {
    if (!LAB.ultimo72){ alert('Corre la simulación antes de guardarla.'); return; }
    const u = LAB.ultimo72;
    try {
      await api({ action:'lab_guardar', herramienta:'72h', titulo:'Simulación de 72 h',
        semilla:20260818,
        entrada:{ texto:u.texto, canales:u.canales, cupo:u.cupo, hora:u.hora,
                  urgente:u.urgente, supuestos:LAB.coef },
        salida:{ total:u.res.total, lleno:u.res.lleno, ventana:u.res.ventana,
                 consultas:u.res.consultas } });
      b7g.textContent = 'Guardada ✓';
      setTimeout(()=>b7g.textContent = 'Guardar la corrida', 2200);
    } catch (err) { alert(err.message); }
  };

  // ── Ensayo de consejería
  $$('#lcCasos button[data-caso]').forEach(b => b.onclick = () => {
    $$('#lcCasos button[data-caso]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    lcCaso = +b.dataset.caso; lcTurnos = []; pintarChat();
    if ($('#lcRub')) $('#lcRub').innerHTML = '';
  });
  const lcI = $('#lcIniciar');
  if (lcI) lcI.onclick = () => { lcTurnos = []; if ($('#lcRub')) $('#lcRub').innerHTML = '';
    lcEnviarTurno('Hola, buenas tardes. Pásale, ¿en qué te puedo ayudar?'); };
  const lcE = $('#lcEnviar'), lcT = $('#lcTexto');
  const manda = () => { const t = (lcT?.value || '').trim(); if (!t) return;
    lcT.value = ''; lcEnviarTurno(t); };
  if (lcE) lcE.onclick = manda;
  if (lcT) lcT.onkeydown = e => { if (e.key === 'Enter') manda(); };
  const lcR = $('#lcRubrica');
  if (lcR) lcR.onclick = async () => {
    if (lcTurnos.length < 4){ alert('Ten al menos un par de intercambios antes de pedir la rúbrica.'); return; }
    lcR.disabled = true; lcR.textContent = 'PUM-AI está revisando…';
    try {
      const trans = lcTurnos.map(t => (t.rol === 'user' ? 'CONSEJERÍA: ' : 'PERSONA: ') + t.texto).join('\n');
      const r = await api({ action:'lab_ai', modo:'rubrica', caso:CASOS[lcCaso].d, transcripcion:trans });
      pintarRubrica(r.rubrica);
    } catch (err) { alert(err.message); }
    finally { lcR.disabled = false; lcR.textContent = 'Terminar y pedir la rúbrica'; }
  };
}

function conectar(){
  // toggles gráfica / tabla
  $$('.tgl[data-t]').forEach(b => b.onclick = () => {
    const id = b.dataset.t, tabla = b.dataset.mode === 't';
    $(`#${id}-g`).style.display = tabla ? 'none' : '';
    $(`#${id}-t`).classList.toggle('on', tabla);
    $$(`.tgl[data-t="${id}"]`).forEach(x => x.classList.toggle('on', x === b));
  });
  conectarLab();
  // Periodo y Área
  $$('.filters button[data-f]').forEach(b => b.onclick = () => {
    const campo = b.dataset.f;
    const bruto = b.dataset.v;
    aplicarFiltro(campo, bruto === '' ? null : (campo === 'meses' ? +bruto : bruto));
  });
  // filtros del banco de preguntas
  $$('.tgl[data-qf]').forEach(b => b.onclick = () => {
    $$('.tgl[data-qf]').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); pintarPreguntas(b.dataset.qf);
  });
  // ficha del rol seleccionado al dar de alta
  const uRol = $('#uRol');
  if (uRol){
    const pinta = () => {
      const r = ROLES[uRol.value];
      $('#uRolInfo').innerHTML = `<b style="color:var(--text-primary)">${r.para}</b><br>${r.desc}
        <div style="margin-top:8px;color:var(--warn);display:flex;gap:7px"><span>⚠</span><span>${r.ojo}</span></div>`;
    };
    uRol.onchange = pinta; pinta();
    $$('[data-edit]').forEach(b => b.onclick = () => {
      $('#uLabel').value = b.dataset.edit; uRol.value = b.dataset.rol; pinta();
      $('#uLabel').scrollIntoView({ block:'center', behavior:'smooth' });
    });
    $('#uGuardar').onclick = async () => {
      const msg = $('#uMsg');
      if (DEMO){ msg.style.color='var(--warn)';
        msg.textContent='Modo demostración: no se guardó.'; return; }
      try {
        await api({ action:'staff_upsert', label:$('#uLabel').value,
          role:uRol.value, password:$('#uPass').value || null,
          active:$('#uActivo').value === 'true' });
        const r = await api({ action:'staff_list' });
        M.personal = r.rows.map(u=>({ id:u.label, rol:u.role, alta:String(u.created_at).slice(0,10),
          visto:u.last_seen ? String(u.last_seen).slice(0,16).replace('T',' ') : null, activo:u.active }));
        msg.style.color='var(--ok)'; msg.textContent='Guardado.';
        $('#uPass').value=''; setTimeout(()=>ir('usuarios'), 700);
      } catch (err){ msg.style.color='var(--critical)'; msg.textContent=err.message; }
    };
  }
  // tooltips
  $$('.hit').forEach(g => {
    g.style.cursor = 'default';
    g.addEventListener('mousemove', e => tipOn(e, g.dataset.tip));
    g.addEventListener('mouseleave', tipOff);
  });
}
</script>
</body>
